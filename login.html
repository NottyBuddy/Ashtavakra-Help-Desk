<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Ashtavakra</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">






<style id="ashtavakra-login-clean-theme">
:root{color-scheme:light;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#F7F7F5;color:#17171B}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:min(100%,500px);padding:32px;background:#54243B;color:#F7F7F5;border:1px solid #54243B;border-radius:0;box-shadow:none}
.brand{font-size:12px;letter-spacing:2px;font-weight:600;color:#F7F7F5;padding-bottom:13px;border-bottom:1px solid rgba(247,247,245,.65)}
h1{font-size:clamp(32px,7vw,42px);line-height:1.08;letter-spacing:-.04em;font-weight:400;color:#F7F7F5;margin:10px 0}
p.tag{font-size:13px;line-height:1.6;color:#F7F7F5;margin:10px 0 25px}
label{display:block;font-size:12px;color:#F7F7F5;margin:16px 0 7px}
input{display:block;width:100%;padding:13px 14px;border-radius:9px;border:1px solid #D9D5D0;background:#E8F0FE;color:#17171B;font:inherit;font-size:12px;outline:none}
input:focus{border-color:#54243B;box-shadow:0 0 0 2px rgba(247,247,245,.35)}
button,.primary{width:100%;border:1px solid #EACBD5;border-radius:999px;padding:13px 16px;margin-top:20px;background:#EACBD5;color:#54243B;font:400 13px inherit;cursor:pointer;transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease}
button:hover:not(:disabled),button:focus-visible:not(:disabled),.primary:hover:not(:disabled){background:#54243B;color:#F7F7F5;border-color:#F7F7F5;outline:none;box-shadow:none;transform:none}
button:disabled{opacity:.6;cursor:wait}
a{color:#F7F7F5;text-decoration:none}
a:hover{color:#F7F7F5;text-decoration:underline}
.switch{font-size:12px;margin-top:16px;color:#F7F7F5}
.msg{min-height:22px;color:#F7D5D5;font-size:12px;margin-top:13px}
.hint{font-size:11px;color:#F7F7F5;line-height:1.6;margin-top:42px}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.row input{width:auto}
@media(max-width:560px){body{padding:14px}.panel{padding:25px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

/* LOGIN PAGE — FINAL APPROVED PALETTE LOCK */
html,body{background:#F7F7F5!important;background-image:none!important;color:#17171B!important;color-scheme:light!important}
body{background:#F7F7F5!important}
body .panel{background:#54243B!important;background-image:none!important;color:#F7F7F5!important;border:1px solid #54243B!important;box-shadow:none!important}
body .brand,body h1,body p,body label,body .switch,body .hint,body a{color:#F7F7F5!important;background:transparent!important;background-image:none!important}
body input,body input:focus,body input:focus-visible{background:#F7F7F5!important;background-image:none!important;color:#17171B!important;border:1px solid #D8D4CF!important;box-shadow:none!important;outline:none!important}
body button,body button:hover,body button:focus,body button:focus-visible,body .primary{background:#F7F7F5!important;background-image:none!important;color:#54243B!important;border:1px solid #F7F7F5!important;box-shadow:none!important;outline:none!important;transform:none!important;filter:none!important}
body a:hover,body a:focus,body a:focus-visible{color:#F7F7F5!important;background:transparent!important;text-decoration:underline!important;outline:none!important;box-shadow:none!important}
body .msg{color:#F7D5D5!important}
body *::before,body *::after{background-image:none!important;box-shadow:none!important}
@media(prefers-reduced-motion:no-preference){body button{transition:none!important}}
</style>
</head><body><main class="panel"><div class="brand">ASHTAVAKRA · INTELLIGENT AI WORKSPACE</div><h1 id="heading">Agent & Team Lead Sign in</h1><p class="tag" id="sub">Use your approved company work email to access Ashtavakra.</p>
<form id="loginForm"><label>Company work email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Sign in</button></form>
<p class="switch" id="recoverySwitch"><a href="#" id="showRecovery">Forgot Team Lead password?</a></p>
<form id="recoveryForm" class="hidden"><label>Admin recovery token</label><input id="recoveryToken" type="password" autocomplete="off" required minlength="32" maxlength="256"><label>New password (minimum 12 characters)</label><input id="recoveryNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label>Confirm new password</label><input id="recoveryConfirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="recoveryBtn">Reset Team Lead password</button><p class="switch"><a href="#" id="backToLogin">Back to sign in</a></p></form>
<form id="changeForm" class="hidden"><label>Current temporary password</label><input id="currentPassword" type="password" autocomplete="current-password" required><label>New password (minimum 12 characters)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button id="changeBtn">Update password</button></form>
<div class="msg" id="message" role="status"></div><p class="hint" id="hint">Access is restricted to accounts created and approved by the Team Lead. No public registration is available.</p></main>
<script>
const $=id=>document.getElementById(id);let pendingUser=null;
function showChange(user){pendingUser=user;$("loginForm").classList.add("hidden");$("changeForm").classList.remove("hidden");$("heading").textContent="Change your temporary password";$("sub").textContent="A new password is required before you can open the portal.";$("hint").textContent="Choose a unique password of at least 12 characters. Do not share it.";$("message").textContent="";}
function goFor(user){location.replace(user.role==="admin"?"/admin.html":"/");}
function showRecovery(){ $("loginForm").classList.add("hidden");$("changeForm").classList.add("hidden");$("recoveryForm").classList.remove("hidden");$("recoverySwitch").classList.add("hidden");$("heading").textContent="Reset Team Lead password";$("sub").textContent="Use the Admin Recovery Token configured in Cloudflare Pages Secrets."; $("hint").textContent="Recovery updates the existing approved Team Lead account only. The token and new password are sent securely to the portal API and are not displayed."; $("message").textContent="";}
function backToLogin(){ $("recoveryForm").classList.add("hidden");$("loginForm").classList.remove("hidden");$("recoverySwitch").classList.remove("hidden");$("heading").textContent="Agent & Team Lead Sign in";$("sub").textContent="Use your approved company work email to access the Help Desk.";$("hint").textContent="Access is restricted to accounts created and approved by the Team Lead. No public registration is available.";$("message").textContent="";}
async function api(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:"Unexpected server response."}));if(!r.ok)throw new Error(d.error||"Request failed.");return d;}
$("showRecovery").addEventListener("click",e=>{e.preventDefault();showRecovery();});
$("backToLogin").addEventListener("click",e=>{e.preventDefault();backToLogin();});
$("recoveryForm").addEventListener("submit",async e=>{e.preventDefault();$("recoveryBtn").disabled=true;$("message").textContent="";try{if($("recoveryNewPassword").value!==$("recoveryConfirmPassword").value)throw new Error("New password and confirmation do not match.");const d=await api("/api/setup/admin/recover",{recoveryToken:$("recoveryToken").value,newPassword:$("recoveryNewPassword").value});$("recoveryForm").classList.add("hidden");$("loginForm").classList.remove("hidden");$("recoverySwitch").classList.remove("hidden");$("heading").textContent="Password reset successful";$("sub").textContent=d.message||"Sign in using your new Team Lead password.";$("hint").textContent="For security, sign in again with your new password.";$("message").textContent="";$("email").focus();}catch(err){$("message").textContent=err.message;}finally{$("recoveryBtn").disabled=false;}});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("message").textContent="";try{const d=await api("/api/auth/login",{email:$("email").value,password:$("password").value});if(d.user.mustChangePassword)showChange(d.user);else goFor(d.user);}catch(err){$("message").textContent=err.message;}finally{$("loginBtn").disabled=false;}});
$("changeForm").addEventListener("submit",async e=>{e.preventDefault();$("changeBtn").disabled=true;$("message").textContent="";try{if($("newPassword").value!==$("confirmPassword").value)throw new Error("New password and confirmation do not match.");await api("/api/auth/change-password",{currentPassword:$("currentPassword").value,newPassword:$("newPassword").value});const d=await fetch("/api/auth/me",{credentials:"same-origin"}).then(r=>r.json());if(!d.ok)throw new Error("Please sign in again.");goFor({...d.user,mustChangePassword:false});}catch(err){$("message").textContent=err.message;}finally{$("changeBtn").disabled=false;}});
(async()=>{try{const r=await fetch("/api/auth/me",{credentials:"same-origin"});if(r.ok){const d=await r.json();if(d.user.mustChangePassword)showChange(d.user);else goFor(d.user);}}catch(e){}})();
</script>








</body></html>
