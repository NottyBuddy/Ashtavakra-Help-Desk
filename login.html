<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Ashtavakra</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#080d19;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 80% 5%,#26366d88,transparent 40%),#080d19}.panel{width:min(100%,440px);padding:32px;border:1px solid #8299d533;border-radius:20px;background:#111b30ed;box-shadow:0 24px 80px #0008}.brand{font-size:12px;letter-spacing:2px;color:#9eb7ff;font-weight:800}.tag{color:#a9b7d1;font-size:13px;margin:7px 0 25px}h1{font-size:25px;margin:10px 0}label{display:block;font-size:12px;color:#b9c6dd;margin:16px 0 7px}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #60749b66;background:#0a1325;color:#fff;font-size:14px;outline:none}input:focus{border-color:#8ca8ff}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:20px;background:linear-gradient(110deg,#617dff,#6271d9);color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:22px;color:#ffb7b7;font-size:12px;margin-top:13px}.hint{font-size:11px;color:#8494b2;line-height:1.6;margin-top:18px}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center}.row input{width:auto}.switch{font-size:12px;color:#aab9d3;margin-top:16px}

:root{color-scheme:light;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif!important;background:#F3F3F1!important;color:#111!important}body{min-height:100vh;display:grid;place-items:center;padding:24px!important;background:radial-gradient(ellipse at 82% 8%,#e7e7e3,transparent 36%),#F3F3F1!important}.panel,.login-card,.auth-card,main{width:min(100%,500px)!important;padding:clamp(26px,5vw,42px)!important;background:#fff!important;border:1px solid #E4E4E2!important;border-radius:28px!important;box-shadow:0 24px 70px #1111!important;color:#111!important}h1,h2{font-size:clamp(32px,7vw,42px)!important;line-height:1.06!important;letter-spacing:-.055em!important;color:#111!important}p,.muted,.hint,.tag,small{color:#777!important;line-height:1.7}label{display:block;color:#444!important;font-size:12px!important;font-weight:700;margin:18px 0 7px!important}input{width:100%;padding:14px 16px!important;border-radius:9999px!important;border:1px solid #E4E4E2!important;background:#F8F8F6!important;color:#111!important;font:inherit!important;outline:none!important}input:focus{border-color:#141414!important;box-shadow:0 0 0 3px #141412!important}button,.primary{border:0!important;background:#141414!important;color:#fff!important;border-radius:9999px!important;padding:14px 20px!important;font:700 13px 'Plus Jakarta Sans',sans-serif!important;cursor:pointer}button:disabled{opacity:.55}a{color:#111!important;text-decoration:none}.msg{color:#8b3030!important;font-size:12px}.success{color:#286448!important}.brand,.eyebrow{color:#777!important;letter-spacing:2px!important;font-weight:800}.hidden{display:none!important}
 .brand{background:linear-gradient(90deg,#0b8f67,#2563eb,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent!important}.panel{border-color:#d9e9e4!important;box-shadow:0 24px 80px #123d3a18!important}button{background:linear-gradient(110deg,#0b9a70,#2563eb 58%,#f59e0b)!important}
/* ASHTAVAKRA GLASS DESIGN SYSTEM — Authentication */
:root{color-scheme:dark!important}
html,body{background:#071426!important;color:#edf3fb!important;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif!important}
body{background:radial-gradient(ellipse at 80% 4%,rgba(212,175,55,.15),transparent 34%),radial-gradient(ellipse at 12% 70%,rgba(63,130,180,.18),transparent 38%),linear-gradient(145deg,#071426,#0b1c33)!important}
.panel,.login-card,.auth-card,main{background:linear-gradient(145deg,rgba(22,48,76,.80),rgba(9,27,49,.88))!important;border:1px solid rgba(212,175,55,.24)!important;border-radius:24px!important;box-shadow:0 28px 90px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.08)!important;backdrop-filter:blur(26px) saturate(150%)!important;-webkit-backdrop-filter:blur(26px) saturate(150%)!important;color:#edf3fb!important}
.brand,.eyebrow{background:none!important;color:#e8d28b!important;-webkit-text-fill-color:#e8d28b!important;letter-spacing:1.8px!important}
h1,h2{color:#f4f7fb!important}
p,.muted,.hint,.tag,small,label{color:#a8b8cc!important}
input{background:rgba(4,19,36,.68)!important;border:1px solid rgba(197,216,240,.22)!important;color:#f4f7fb!important;border-radius:12px!important}
input:focus{border-color:#d4af37!important;box-shadow:0 0 0 3px rgba(212,175,55,.14)!important;outline:none!important}
button,.primary{background:linear-gradient(120deg,#d4af37,#b98e24)!important;color:#13243a!important;border:1px solid rgba(240,217,138,.55)!important;border-radius:12px!important;font-weight:800!important}
a{color:#f0d98a!important}
.msg{color:#ffb8b8!important}.success{color:#8ce0bb!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><main class="panel"><div class="brand">ASHTAVAKRA · INTELLIGENT AI WORKSPACE</div><h1 id="heading">Agent & Team Lead Sign in</h1><p class="tag" id="sub">Use your approved company work email to access Ashtavakra.</p>
<form id="loginForm"><label>Company work email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Sign in</button></form>
<p class="switch" id="recoverySwitch"><a href="#" id="showRecovery">Forgot Team Lead password?</a></p>
<form id="recoveryForm" class="hidden"><label>Admin recovery token</label><input id="recoveryToken" type="password" autocomplete="off" required minlength="32" maxlength="256"><label>New password (minimum 12 characters)</label><input id="recoveryNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label>Confirm new password</label><input id="recoveryConfirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="recoveryBtn">Reset Team Lead password</button><p class="switch"><a href="#" id="backToLogin">Back to sign in</a></p></form>
<form id="changeForm" class="hidden"><label>Current temporary password</label><input id="currentPassword" type="password" autocomplete="current-password" required><label>New password (minimum 12 characters)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button id="changeBtn">Update password</button></form>
<div class="msg" id="message" role="status"></div><p class="hint" id="hint">Access is restricted to accounts created and approved by the Team Lead. No public registration is available.</p></main>
<script>
const $=id=>document.getElementById(id);let pendingUser=null;
function showChange(user){pendingUser=user;$("loginForm").classList.add("hidden");$("changeForm").classList.remove("hidden");$("heading").textContent="Change your temporary password";$("sub").textContent="A new password is required before you can open the portal.";$("hint").textContent="Choose a unique password of at least 12 characters. Do not share it.";$("message").textContent="";}
function goFor(user){location.replace(user.role==="admin"?"/admin.html":"/");}
function showRecovery(){ $("loginForm").classList.add("hidden");$("changeForm").classList.add("hidden");$("recoveryForm").classList.remove("hidden");$("recoverySwitch").classList.add("hidden");$("heading").textContent="Reset Team Lead password";$("sub").textContent="Use the Admin Recovery Token configured in Cloudflare Pages Secrets."; $("hint").textContent="Recovery updates the existing approved Team Lead account only. The token and new password are sent securely to the portal API and are not displayed."; $("message").textContent="";}
function backToLogin(){ $("recoveryForm").classList.add("hidden");$("loginForm").classList.remove("hidden");$("recoverySwitch").classList.remove("hidden");$("heading").textContent="Agent & Team Lead Sign in";$("sub").textContent="Use your approved company work email to access the Help Desk.";$("hint").textContent="Access is restricted to accounts created and approved by the Team Lead. No public registration is available.";$("message").textContent="";}
async function api(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:"Unexpected server response."}));if(!r.ok)throw new Error(d.error||"Request failed.");return d;}
$("showRecovery").addEventListener("click",e=>{e.preventDefault();showRecovery();});
$("backToLogin").addEventListener("click",e=>{e.preventDefault();backToLogin();});
$("recoveryForm").addEventListener("submit",async e=>{e.preventDefault();$("recoveryBtn").disabled=true;$("message").textContent="";try{if($("recoveryNewPassword").value!==$("recoveryConfirmPassword").value)throw new Error("New password and confirmation do not match.");const d=await api("/api/setup/admin/recover",{recoveryToken:$("recoveryToken").value,newPassword:$("recoveryNewPassword").value});$("recoveryForm").classList.add("hidden");$("loginForm").classList.remove("hidden");$("recoverySwitch").classList.remove("hidden");$("heading").textContent="Password reset successful";$("sub").textContent=d.message||"Sign in using your new Team Lead password.";$("hint").textContent="For security, sign in again with your new password.";$("message").textContent="";$("email").focus();}catch(err){$("message").textContent=err.message;}finally{$("recoveryBtn").disabled=false;}});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("message").textContent="";try{const d=await api("/api/auth/login",{email:$("email").value,password:$("password").value});if(d.user.mustChangePassword)showChange(d.user);else goFor(d.user);}catch(err){$("message").textContent=err.message;}finally{$("loginBtn").disabled=false;}});
$("changeForm").addEventListener("submit",async e=>{e.preventDefault();$("changeBtn").disabled=true;$("message").textContent="";try{if($("newPassword").value!==$("confirmPassword").value)throw new Error("New password and confirmation do not match.");await api("/api/auth/change-password",{currentPassword:$("currentPassword").value,newPassword:$("newPassword").value});const d=await fetch("/api/auth/me",{credentials:"same-origin"}).then(r=>r.json());if(!d.ok)throw new Error("Please sign in again.");goFor({...d.user,mustChangePassword:false});}catch(err){$("message").textContent=err.message;}finally{$("changeBtn").disabled=false;}});
(async()=>{try{const r=await fetch("/api/auth/me",{credentials:"same-origin"});if(r.ok){const d=await r.json();if(d.user.mustChangePassword)showChange(d.user);else goFor(d.user);}}catch(e){}})();
</script></body></html>
