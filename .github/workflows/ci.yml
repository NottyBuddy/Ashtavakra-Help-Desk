name: Portal CI

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify portal files and inline JavaScript
        run: npm run check
