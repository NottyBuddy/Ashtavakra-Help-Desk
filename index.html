const scriptContent = [["Treat every call as a helpful consultation, not a rigid questionnaire.","Ask one question at a time and allow the customer to respond. Listen actively, acknowledge concerns and keep the conversation supportive.","Use simple language. Do not criticize competitors or local fabricators. Explain IndiFrame's process and value without unsupported comparisons.","Do not promise unauthorized discounts, exact delivery dates, structural approvals, wind-load calculations, millimetre-level specifications, chamber counts or unvalidated technical details.","Every connected call must end with a clear agreed next action. Reconfirm the requirement, responsible team, action, date and time wherever applicable.","Installation is best planned after granite or marble sill work is completed, helping ensure proper fit and reduce site-damage risk."],["Complete these six parameters before assigning a lead stage, wherever the conversation allows.","Project Type: “Is this project for your personal residential home or commercial property?” Capture residential / commercial / villa / apartment.","Site Location: “Which specific city and area/locality is your construction site located in?” Capture area and PIN code; verify serviceability.","Stakeholder Role: “Are you managing the build directly, or working with an architect or interior designer?” Capture self / architect / civil contractor / designer.","Construction Stage: “What stage is the site currently in — Foundation, Brickwork, Plastering, or Finishing?” Capture actual stage; do not assume readiness.","Quantity Estimate: “Approximately how many window and door apertures/openings do you need to cover?” Capture separate quantities where possible.","Aperture Readiness: “Have internal and external plastering been completed around all window openings?” Capture Yes / No / In Progress.","Also capture new construction / renovation, windows / doors / both, uPVC / aluminium / undecided, preferred style, primary requirement, budget sensitivity, timeline, decision-maker, consultation interest, objection and agreed next action."],["C0 — New / Unqualified Lead: New enquiry received. Check protected-account ownership, then initiate Call Attempt 1 immediately after assignment.","C1 — Future Potential Lead: Foundation, slab, brickwork, structural or incomplete-plastering stage. Schedule CRM follow-up against projected readiness. For uPVC enquiries, communicate the approved starting rate ₹450 per sq. ft. onwards plus applicable GST where relevant. Route aluminium enquiries to Sales without price, specification or timeline commitments.","C2 — Active / Qualified Lead: Plastering complete and apertures ready for audit. Offer free site consultation / measurement or Experience Centre visit. Post contact details in Daily Leads WhatsApp Group and tag the Regional Sales Owner. Route aluminium enquiries to Sales without price, specifications or timelines.","C7 — Routed to Partner (B2F): Location is outside direct IndiFrame service coverage. Offer the authorized Green Fortune partner route, transfer lead details and record C7 / ROUTE TO B2F in CRM.","SCENARIO E — LOCATION OUTSIDE DIRECT SERVICE AREA / GREEN FORTUNE PARTNER ROUTE","Context: The project site is outside IndiFrame's direct installation coverage and needs to be routed to an authorized Green Fortune partner.","E1 — Opening & Permission: “Hi Sir/Ma’am, am I speaking with [Customer Name]? I’m [Agent Name], calling from IndiFrame, a windows and doors brand offering uPVC and aluminium windows and doors, about your enquiry. Is this a good time for a quick conversation?”","“I understand your project is located at [Customer Location]. Since our direct installation teams operate selectively in our main service locations, I’d like to understand your project requirements and connect you with the appropriate partner team. May I ask you a few quick questions?”","E2 — Requirement & Existing Enquiry: “Are you currently looking for windows, doors, or both?” “Our enquiry details mention approximately [Quantity] units and interest in [Type]. Is that still correct?” “Just to confirm, the project is located at [Customer Location], correct?” “Are you considering uPVC, aluminium, or would you like the technical team to guide you?” “Do you have a preferred style such as sliding, casement, fixed, tilt & turn, or slide & fold?”","E3 — Site Stage & Decision Maker: “Is this for a new construction or renovation?” “What stage is the project currently in — foundation, brickwork, plastering, or finishing?” “Have internal and external plastering been completed around the window openings?” “When do you expect the project to reach the window and door installation stage?” “Has the granite or marble sill work been completed?” “Will you be making the final decision, or will an architect, builder, contractor, designer, or family member also be involved?”","E4 — Partner Transition: “Since the project is outside our direct service area, we can connect you with an authorized Green Fortune partner for local support. Would you like us to arrange that follow-up?” If customer agrees: “Certainly. The partner team can review your project requirements and guide you on the next steps.”","E5 — Immediate Partner Callback: “Just to reconfirm, you are looking for [Quantity & Type] windows and [Quantity & Type] doors for your [Residential/Commercial] project in [Location], and you would like the partner team to discuss [Requirement/Concern] with you. You can expect a call from the concerned Green Fortune partner team within the next one hour. They will assist you with your requirement and guide you through the next steps.”","E6 — CRM & Handover: Update lead stage as C7 / ROUTE TO B2F. Transfer the customer's requirement, location, project stage, quantity estimate, product preference and agreed callback details to the authorized Green Fortune partner team. Do not promise direct IndiFrame installation or imply that the partner has accepted the lead until the handover is confirmed.","Pricing control: Approved starting communication is “Starts from ₹450 per sq. ft. onwards, plus applicable GST.” Do not calculate custom prices, single-window estimates or unauthorized discounts during initial qualification.","Warranty reference in source script: 15-year profile warranty, 5-year hardware warranty and 7-year colour warranty. Confirm current written terms and exclusions before committing.","Protected accounts: outbound qualification / dialing is strictly prohibited for accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh and Ravi Boliipogu."],["Pricing: communicate only the approved baseline starting rate ₹450 per sq. ft. onwards plus applicable GST, where product / lead rules allow it. No custom calculations, single-window estimates or unauthorized discounts.","Technical scope: do not commit to exact delivery timelines, millimetre-level specifications, chamber counts, wind-load calculations, structural approvals or technical suitability during initial discovery. Refer technical validation to the technical site audit / TAO team.","Aluminium enquiries: route to Sales. Do not provide aluminium prices, specifications or timelines during initial qualification.","Unserviceable locations: offer the authorized Green Fortune partner route, transfer relevant lead details and classify C7 / ROUTE TO B2F. Do not promise direct IndiFrame installation outside approved coverage.","UNREACHABLE LEADS — CONFIRMED RETRY POLICY: Execute a maximum of 15 call attempts across 9 calendar days. Vary calling time slots where practical and record the exact disposition immediately after every attempt. Apply the current Operations-approved disposition and closure rules.","Protected accounts: check ownership before outbound calling. Do not dial accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh or Ravi Boliipogu.","Customer privacy / opt-out: if a customer asks to remove their number, acknowledge the request and update the system according to the approved internal opt-out process."],["C0: new lead from marketing channels; make first call immediately after assignment, after protected-account check.","C1: future potential lead; schedule CRM follow-up against projected construction / plastering readiness.","C2: active / qualified lead; post contact details in Daily Leads WhatsApp Group and tag Regional Sales Owner. Confirm whether Sales contacted the customer; if not, update CRM and share the concern / details in the designated group.","C7: outside direct service coverage; offer authorized Green Fortune partner routing, transfer relevant details and record C7 / ROUTE TO B2F.","C4: Won Lead when payment is done and manufacturing has started. Update CRM, initiate order processing / manufacturing handover and share confirmation details with customer.","C6: Lost Lead due to a specific reason. Record reason, update status to Lost and schedule long-term nurturing / feedback follow-up if applicable.","Every handover should include requirement, location, project stage, quantity estimate and agreed next action wherever available. Update CRM immediately and accurately."],["Brand introduction: “Sir/Ma’am, IndiFrame provides different types of windows and doors based on customer requirements, design preferences and project needs. Our team can guide you on a suitable solution for your project.”","uPVC: “uPVC stands for Unplasticized Polyvinyl Chloride. It is a strong, durable and low-maintenance material commonly used for windows and doors. Depending on the overall configuration, it can provide good insulation and may help reduce outside noise and heat.”","Quick explanation: “IndiFrame provides uPVC and aluminium windows and doors in designs such as sliding, casement, fixed, tilt & turn and slide & fold. Our team can understand your requirements and suggest a suitable option.”","The source script identifies Hyderabad as headquarters and service across Andhra Pradesh, Maharashtra and Telangana. Verify the customer's specific locality before promising service.","Describe IndiFrame and Green Fortune accurately as the same company / business context. Do not call Green Fortune an unrelated third-party company. For outside direct coverage, use the authorized Green Fortune partner route."],["Mandatory renovation sequence: confirm whether the customer will remove / uninstall existing windows and doors before IndiFrame work starts.","Explain that existing windows and doors must be completely removed by the customer or their team before IndiFrame installation can begin. Ask whether the customer agrees.","If yes, capture expected date / time for removal and site readiness. Then confirm a convenient date and time for the team to follow up.","Approved line: “Since this is a renovation project, I’d like to confirm one important point. The existing windows and doors will need to be removed before our work starts. Will you be able to get them removed before we begin?”","If unsure: explain that IndiFrame does not provide uninstallation services and can start only after existing windows and doors have been completely removed by the customer's team. Ask for final confirmation and follow-up time.","Do not confirm installation before removal is complete. If no: customer can call back when the site is ready or contact 9959083498, as stated in the source script."],["Context: fresh enquiries from Meta, Google, website, WhatsApp or another digital channel.","Opening: “Good [morning/afternoon/evening], Sir/Ma’am. I’m calling from IndiFrame, a brand offering uPVC and aluminium windows and doors. We received your enquiry on [Facebook / Instagram / WhatsApp / Website]. Is this a good time for a quick conversation?”","Ask: windows / doors / both; new construction or renovation; residential or commercial; city and area / locality.","Quantity and style: “Approximately how many windows and doors do you need? A rough count is fine for now.” “Do you have a preferred style such as sliding, casement, fixed, tilt & turn or slide & fold?”","Site readiness: ask current stage, expected installation timeline, whether internal / external plastering is complete and whether granite / marble sill work is complete.","If customer wants installation before sill work: “I’ll note that. Our Sales Team will check the site condition and confirm the suitable installation stage with you.”","Decision-maker: ask whether the customer, architect, builder, contractor, designer or family member will make the final decision. Invite relevant stakeholders to the consultation.","Close by recapping quantity, type, project type and location. Offer Sales Team discussion, site consultation, Experience Centre visit or callback. Reconfirm next step."],["Source-content status: the latest detailed script reviewed includes a Field Spotted Lead scenario, but a separate approved Inbound / Walk-in script was not located. Do not present an invented walk-in script as approved.","Safe handling until a dedicated script is approved: acknowledge the enquiry, introduce IndiFrame, ask permission, identify windows / doors / both, capture project type and location, ask the six mandatory discovery questions, discuss only approved product information and agree the next action.","Related source scenario — Field Spotted Lead: “I’m calling on behalf of IndiFrame Windows and Doors. Our field officer [Name] recently noted your construction work at [Location]. Is this a good time to ask a few questions to understand your requirements?”","Confirm field notes: “Our notes mention approximately [Quantity] units and interest in [Type]. Is that still correct?” Verify location, construction stage, plastering / sill readiness and decision-maker status.","Offer Sales callback, site consultation, Experience Centre visit, factory visit or authorized partner follow-up depending on serviceability and customer preference."],["Context: customer visited an IndiFrame display, exhibition or public event.","Opening: “We noted that you visited our display at [Event Name] held on [Event Date] at [Event Location]. Is this a good time for a quick conversation?”","Confirm whether they need windows, doors or both; validate event notes on quantity and type; reconfirm project location.","Ask whether they are considering uPVC, aluminium or technical guidance; preferred style; and main priority such as appearance, ventilation, natural light, sound reduction, ease of operation, safety, heat reduction or privacy. Do not promise unverified performance.","Ask new construction / renovation, construction stage, plastering readiness, expected installation stage, sill work and decision-maker.","Close with site consultation, Sales callback, Experience Centre visit or Medchal factory visit. Reconfirm requirement, location, next step, date and time."],["Context: existing lead previously waiting for construction progress, budget, timing or a decision.","Opening: “We spoke [days/weeks] ago about your window and door requirements for [Project / Location]. I wanted to check how your project is moving along. Is this a good time?”","Recap: “Our notes mention [Quantity] units of [Type]. Have there been any changes?” Ask whether quotation / details were reviewed and what needs clarification.","Construction delay: “Construction timelines can change. Installation is best planned after granite or marble sill work is completed. What stage are your walls and sills at now?”","Budget: ask whether comparing a branded provider or local vendor. Explain consultation, measurement, manufacturing, installation coordination and after-sales support without criticizing competitors.","Close by recapping requirement, location, concerned team, concern / requirement and follow-up date / time. For immediate consultation, confirm Sales follow-up to coordinate the visit."],["Why choose IndiFrame? “We provide an organized process: professional consultation, suitable product guidance, standardized manufacturing, trained installation support, warranty support and after-sales service.”","Local fabricator objection: acknowledge the budget concern. Explain the structured process—product guidance, professional measurement support, manufacturing, installation coordination, warranty support and after-sales service. Do not criticize competitors.","Location concern: “We request the location to check service coverage for your area, assign the appropriate local team and arrange site measurement / installation support.”","Number source: “Your number was registered through the enquiry source where you expressed interest in windows and doors. We are following up to understand your requirements.”","Just exploring: “That is completely fine. Exploring options is a good way to start. We can understand what you are considering and guide you when you are ready.”","WhatsApp details: “I’d be happy to share relevant product details. May I confirm whether you are looking for windows, doors or both?”","Price only: “Our products start from ₹450 per sq. ft. onwards plus applicable GST, where applicable. May I ask for a rough quantity and type?” No custom quote or discount promise.","Customer shares measurements: collect width, height, quantity and type for initial review. Final precise measurements must be verified by the consultation team at site before final quotation.","Busy: ask for a convenient callback date / time. Remove number: acknowledge and update approved opt-out process. Already purchased: congratulate and close politely. Project postponed: note and agree a future check-in. Competitor selected: ask reason only if customer is comfortable.","Installation / after-sales: source confirms trained installation and dedicated after-sales teams; coordination depends on site condition and serviceability. Experience Centre visit can be offered."],["Immediately: “We can arrange the next step with the relevant team, subject to site readiness and technical confirmation.”","Within 1 month: plan consultation and next steps around the construction schedule.","1–3 months: use the available window to plan consultation, designs, measurements and next steps.","3–6 months: arrange follow-up closer to the installation timeline.","Price concern: acknowledge budget management and offer Sales discussion on value and suitable options.","Delivery / installation date: never promise an exact date during qualification. Timeline depends on project requirements and site readiness; the concerned team must assess and coordinate."],["D2 — Recap: “Following our previous conversation about your project in [Location], I wanted to recap your requirement for about [Quantity] units of [Type] and understand the next step.”","D3 — Site consultation pending: ask whether customer wants a convenient date / time for the technical team to visit and take required measurements.","D4 — Consultation completed: ask whether customer reviewed site details or wants the team to discuss next steps.","D5 — Quotation shared: ask whether customer reviewed the quotation and whether clarification is required.","D6 / D7 — Price high / competitor comparison: discuss product suitability, hardware, installation, warranty support and long-term service; offer Sales clarification.","D8 / D9 — Needs time / family decision: allow time and confirm a suitable follow-up date / time.","D10 — Project delayed: note temporary pause and agree a date to check back.","D11 — Selected another brand: ask which brand and whether decision was based on price, product, service, relationship or timeline, if customer is comfortable.","D12 / D13 — Ready to proceed / order confirmation pending: arrange order confirmation and next steps for custom-made manufacturing through the relevant team."],["Factory: Medchal, Hyderabad. Coordinate a factory visit so customers can understand the manufacturing process and product range. Confirm appointment date / time.","Hyderabad — Kukatpally Experience Centre: 4th Floor, 5-35, Vilax Prime, 189-A, 100 Feet Road, Prashanti Nagar, I.E., Kukatpally, Hyderabad, Telangana 500072.","Hyderabad — Jubilee Hills Experience Centre: 82, House No. 8, Road Number 40, CBI Colony, Jubilee Hills, Hyderabad, Telangana 500033.","Mumbai — Malad West Experience Centre: Lobby 3, 2nd Floor, Auris Galleria, 218, Kanchpada, Malad West, Mumbai, Maharashtra 400064.","Ask whether customer prefers Medchal factory, an Experience Centre, site consultation or Sales Team follow-up.","Reconfirm exact location, date and time. Do not imply walk-in availability; coordinate the appointment."],["Thank the customer and acknowledge the requirement.","Reconfirm quantity and type of windows / doors, project type and site location.","State agreed next step: Sales callback / site consultation / Experience Centre visit / factory visit / partner follow-up.","Confirm responsible team and scheduled date / time. State one-hour callback only where the relevant team has accepted that commitment.","Ask: “Have I understood that correctly?” Wait for confirmation.","Mandatory sequence: Requirement → Relevant Team → Action → Date → Time → Expected Follow-up. Never end with a vague “Okay, our team will contact you.”","Final close: “Thank you for considering IndiFrame. We appreciate your time and look forward to assisting you. Have a wonderful day.”"],["Capture customer name, contact number and lead source.","Capture city, locality, project address / landmark and verify serviceability.","Capture residential / commercial, new construction / renovation and construction stage.","Capture windows required, doors required, approximate quantity and uPVC / aluminium / undecided.","Capture product type / configuration and primary requirement.","Capture budget sensitivity, expected installation timeline and decision-maker details.","Capture architect / contractor / builder details, competitor status, site consultation interest, Experience Centre interest, quotation status and objection.","Capture agreed next action and next follow-up date / time.","Before closing, confirm customer name, window / door quantity and type, project location, action, relevant team, date, time and visit type if applicable."],["C2 qualified leads: post customer contact details in the Daily Leads WhatsApp Group and tag the Regional Sales Owner.","C1 future leads: schedule CRM follow-up based on projected construction / plastering readiness date.","C7 / ROUTE TO B2F: when the location is outside direct IndiFrame coverage, offer the authorized Green Fortune partner route, obtain customer consent for partner follow-up, transfer the relevant lead details and update CRM to C7. Reconfirm the partner callback expectation and record the handover.","Unanswered calls: maximum 15 call attempts across 9 calendar days. Record the exact disposition immediately after each attempt. Do not use the superseded 9 attempts / 12 days cadence.","Protected accounts: do not outbound qualify or dial accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh or Ravi Boliipogu.","Every handoff should include requirement, location, project stage, quantity estimate, product preference and agreed next step wherever available. Update CRM immediately and accurately."],["TELUGU REFERENCE CALL — ENGLISH LETTERS. Telugu transliteration is provided below alongside the approved English meaning for agent reference. Keep the conversation natural and ask one question at a time.","OPENING — English: “Good morning, Sir/Ma’am. I’m [Agent Name], calling from IndiFrame regarding your enquiry for windows and doors. Is this a good time to talk?”","OPENING — Telugu (English letters): “Namaskaaram Sir/Madam. Nenu [Agent Name], IndiFrame nundi maatlaadutunnanu. Windows mariyu doors kosam meeru ichina enquiry gurinchi call chesanu. Ippudu maatlaadataniki meeku samayam undaa?”","PERMISSION — English: “Thank you. May I ask you a few quick questions to understand your project and guide you properly?”","PERMISSION — Telugu: “Dhanyavaadalu. Mee project mariyu avasaraalu sarigga artham chesukoni guide cheyadaniki konni chinna questions adagavachaa?”","REQUIREMENT — English: “Are you looking for windows, doors, or both?”","REQUIREMENT — Telugu: “Meeku windows kaavaalaa, doors kaavaalaa, leka rendu kaavaalaa?”","PROJECT TYPE — English: “Is this for a new construction or a renovation? Is it for a residential or commercial property?”","PROJECT TYPE — Telugu: “Idi kottha construction aa, leka renovation aa? Idi residential property kosamaa, commercial property kosamaa?”","SITE LOCATION — English: “Which city and area is your project located in? Could you also share the PIN code?”","SITE LOCATION — Telugu: “Mee project ye city mariyu ye area lo undi? Dayachesi PIN code kooda cheppagalaraa?”","STAKEHOLDER — English: “Are you managing the project directly, or is an architect, interior designer or contractor involved?”","STAKEHOLDER — Telugu: “Meeru project ni direct ga manage chestunnaraa? Leka architect, interior designer, contractor evaraina involve ayyaraa?”","CONSTRUCTION STAGE — English: “What stage is the site currently in — foundation, brickwork, plastering or finishing?”","CONSTRUCTION STAGE — Telugu: “Mee site ippudu ye stage lo undi — foundation, brickwork, plastering, leka finishing stage lo undaa?”","QUANTITY — English: “Approximately how many window and door openings do you need?”","QUANTITY — Telugu: “Approximate ga enni window mariyu door openings avasaram?”","APERTURE READINESS — English: “Has the internal and external plastering around the window openings been completed?”","APERTURE READINESS — Telugu: “Window openings chuttu internal mariyu external plastering complete ayyindaa?”","SILL WORK — English: “Has the granite or marble sill work been completed? Installation is best planned after this work is completed.”","SILL WORK — Telugu: “Granite leka marble sill work complete ayyindaa? Ee work complete ayyaka installation plan cheyyadam manchidi.”","BRAND / uPVC — English: “IndiFrame offers uPVC and aluminium windows and doors. Our team can guide you based on your requirement.”","BRAND / uPVC — Telugu: “IndiFrame lo uPVC mariyu aluminium windows, doors available unnayi. Mee requirement batti maa team meeku suitable option gurinchi guide chestundi.”","PRICE — English: “Our pricing starts from ₹450 per sq. ft. onwards, plus applicable GST. The exact price depends on your final requirement and specifications.” Use only where the approved product / lead rules permit.","PRICE — Telugu: “Maa pricing square feet ki ₹450 nundi start avutundi, applicable GST extra. Exact price mee final requirement mariyu specifications batti decide avutundi.” Use only where permitted.","UNSERVICEABLE LOCATION — English: “This location is outside our direct service area. We can connect you with an authorized Green Fortune partner for local support. Would you like us to arrange that follow-up?”","UNSERVICEABLE LOCATION — Telugu: “Ee location maa direct service area bayata undi. Local support kosam mimmalni maa authorized Green Fortune partner tho connect cheyagalamu. Aa follow-up arrange cheyyamantara?”","PARTNER CALLBACK — English: “Our concerned Green Fortune partner team will call you within the next one hour and guide you on the next steps.” Say this only when the partner callback has been arranged as per the approved handover process.","PARTNER CALLBACK — Telugu: “Maa Green Fortune partner team next one hour lo meeku call chesi, next steps gurinchi guide chestaaru.” Ee commitment partner callback arrange ayinappude cheppali.","CLOSING — English: “To reconfirm, you need [Quantity & Type] windows and [Quantity & Type] doors for your project at [Location]. The next step is [Action] with [Team] on [Date] at [Time]. Have I understood correctly?”","CLOSING — Telugu: “Oka sari confirm chesukuntaanu. Mee [Location] project kosam [Quantity & Type] windows mariyu [Quantity & Type] doors avasaram. Next step [Action], [Team] tho [Date] na [Time] ki. Nenu correct ga artham chesukunnanaa?”","FINAL THANK YOU — English: “Thank you for your time and for considering IndiFrame. Our team will take the next steps as discussed. Have a good day.”","FINAL THANK YOU — Telugu: “Mee samayam ichinanduku, IndiFrame ni consider chesinanduku dhanyavaadalu. Manam discuss chesina vidhamga maa team next steps teesukuntundi. Have a good day.”","Agent language note: This is a practical Telugu transliteration in English letters for reference. Agents should speak naturally and retain the approved meaning; do not add unapproved price, warranty, technical or delivery commitments."],["C4 / Won: source CRM matrix associates Won with payment done and manufacturing started. Update CRM, initiate order processing / manufacturing handover and share confirmation details with customer.","C6 / Lost: record the specific reason, update CRM status to Lost and schedule long-term nurturing / feedback follow-up if applicable.","Approved lost / closed reason examples: Not Interested; Wrong Number; Wrong Lead; Duplicate Lead; Already Purchased; Competitor Selected; Project Cancelled; Project Postponed; Budget Issue; Price Too High; Location Not Serviceable; No Requirement; Customer Unreachable.","Use the reason that accurately reflects the customer's statement. Do not mark Lost solely because one call was unanswered; follow current approved retry policy and CRM instruction.","C7 / ROUTE TO B2F is a partner-routed status for locations outside direct IndiFrame coverage. It is not the same as a Lost lead."]];
const masterScriptContent = "**INDIFRAME WINDOWS & DOORS** \n\n- **Conversational Pace:** Treat the call like a consultation at a helpful service center desk rather than reading a rigid list. \n\n* **Empathetic Listening:** Pause, validate customer responses, and make them feel supported throughout their building or renovation journey. \n\n- **Complete Flow:** Every scenario runs from start to finish, featuring flexible closing options and expert guidance on project staging—specifically advising customers that **window and door installation is best done after granite/marble sill work is completed** to ensure precise fit and avoid site damage. \n   \n  **QUICK INSTRUCTIONS** \n   \n\n* Follow all 6 mandatory discovery questions before assigning a lead stage. \n\n- Verify construction stage and plaster completion, do not assume readiness. \n\n* Use only authorized numbers and claims: ₹450/sq ft onwards, 15-year profile warranty, 5-year hardware warranty, 7-year color warranty  \n\n- Never criticize competitors or local fabricators; redirect the conversation to value. \n\n* Do not guess technical specifications, delivery dates, structural approvals or other restricted information; hand over to the appropriate sales team. \n\n- Execute the maximum 15 call attempts across 9 calendar days and log the exact disposition immediately. \n\n* Post the customer phone number and tag the exact regional sales owner in the Daily Leads WhatsApp group after the call. \n\n- **Acknowledged. Outbound qualification or dialing on protected accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh, or Ravi Boliipogu is strictly prohibited. These are high-value corporate/project accounts managed directly at the management level.** \n   \n  **The Six Mandatory Discovery Questions** \n\n|   |\n| - |\n\n**Parameter**  \n\n|   |\n| - |\n\n**Approved English Question**  \n\n|   |\n| - |\n\n**Expected Output / Control**  \n\n|   |\n| - |\n\n**Project Type**  \n\n|   |\n| - |\n\nIs this project for your personal residential home or commercial property?  \n\n|   |\n| - |\n\nResidential / Commercial / Villa / Apartment  \n\n|   |\n| - |\n\n**Site Location**  \n\n|   |\n| - |\n\nWhich specific city and area/locality is your construction site located in?  \n\n|   |\n| - |\n\nArea name + PIN code; verify serviceability  \n\n|   |\n| - |\n\n**Stakeholder Role**  \n\n|   |\n| - |\n\nAre you managing the build directly, or working with an architect or interior designer?  \n\n|   |\n| - |\n\nSelf / Architect / Civil Contractor / Designer  \n\n|   |\n| - |\n\n**Construction Stage**  \n\n|   |\n| - |\n\nWhat stage is the site currently in — Foundation, Brickwork, Plastering, or Finishing?  \n\n|   |\n| - |\n\nFoundation / Brickwork / Plastering / Interiors  \n\n|   |\n| - |\n\n**Quantity Estimate**  \n\n|   |\n| - |\n\nApproximately how many window and door apertures/openings do you need to cover?  \n\n|   |\n| - |\n\nEstimated window & door count  \n\n|   |\n| - |\n\n**Aperture Readiness**  \n\n|   |\n| - |\n\nHave internal and external plastering been completed around all window openings?  \n\n|   |\n| - |\n\nYes (Ready) / No (In Progress)  \n\n|   |\n| - |\n\n**BRANCH 1: FUTURE LEAD**  \n\n|   |\n| - |\n\n**BRANCH 2: ACTIVE LEAD**  \n\n|   |\n| - |\n\n**BRANCH 3: UNSERVICEABLE**  \n\n|   |\n| - |\n\n**Site Stage:** Foundation / Slab / Brickwork / Structural / Granite Work \n\n|   |\n| - |\n\n**Site Stage:** Plastering Completed / Ready Openings  \n\n|   |\n| - |\n\n**Site Location:** Outside Direct Company Coverage  \n\n|   |\n| - |\n\n**Action:** Mark Stage C1. Quote starting rate (₹450/sq ft+).  \n\n|   |\n| - |\n\n**Action:** Mark Stage C2. Quote starting rate (₹450/sq ft+). Pitch free site audit/ showroom  \n\n|   |\n| - |\n\n**Action:** Offer Green Fortune Partner Fabricator option.  \n\n|   |\n| - |\n\n**Follow-up:** Set callback schedule (maximum 15 call attempts across 9 calendar days).  \n\n|   |\n| - |\n\n**Handover:** Post to WhatsApp Group & Tagged Regional Sales Owner.  \n\n|   |\n| - |\n\n**Routing:** Transfer Laed to B2F / Log Stage C7 in CRM.  \n\n|   |\n| - |\n\n**PARAMETER CATEGORY**  \n\n|   |\n| - |\n\n**STANDARD OPERATING PROTOCOL & OPERATIONAL RULES**  \n\n|   |\n| - |\n\n**ENFORCEMENT DETAILS**  \n\n|   |\n| - |\n\n**Pricing Quotation Rules**  \n\n|   |\n| - |\n\nAgents are strictly authorized to quote *ONLY* the standard baseline starting rate: **\"Starts from ₹450 per sq ft onwards\"**.  \n\n|   |\n| - |\n\n**STRICT RED LINE** No custom calculations, single-window estimates, or unauthorized discounts permitted.  \n\n|   |\n| - |\n\n**Technical & Scope Boundaries**  \n\n|   |\n| - |\n\nNever commit to exact delivery timelines, mm-level specifications, chamber counts, or wind-load calculations during initial discovery.  \n\n|   |\n| - |\n\nDefer technical specs to the technical site audit team during TAO (Transfer Away / Technical Operations).  \n\n|   |\n| - |\n\n**Unserviceable Locations**  \n\n|   |\n| - |\n\nIf the site location is beyond direct Indi-Frame installation boundaries, offer referral to authorized Green Fortune partner fabricators.  \n\n|   |\n| - |\n\nLog as **C7 (ROUTE TO B2F)** in CRM.  \n\n|   |\n| - |\n\n**Unreachable Leads & Retry Cadence**  \n\n|   |\n| - |\n\nFor unanswered calls, follow the mandatory retry of cadence before archiving the lead.  \n\n|   |\n| - |\n\nExecute a maximum of **maximum 15 call attempts across 9 calendar days**. \n\n**CRM STAGE CLASSIFICATION & HANDOVER MATRIX** \n\n|   |\n| - |\n\n**STAGE CODE**  \n\n|   |\n| - |\n\n**STAGE DESCRIPTION**  \n\n|   |\n| - |\n\n**QUALIFICATION TRIGGER**  \n\n|   |\n| - |\n\n**REQUIRED NEXT ACTION & ROUTING**  \n\n|   |\n| - |\n\n**C0**  \n\n|   |\n| - |\n\nNew Unqualified Lead  \n\n|   |\n| - |\n\nInitial lead ingestion from marketing channels.  \n\n|   |\n| - |\n\nInitiate Call Attempt 1 immediately upon assignment.  \n\n|   |\n| - |\n\n**C1**  \n\n|   |\n| - |\n\nFuture Potential Lead  \n\n|   |\n| - |\n\nPlastering incomplete (Foundation, Brickwork, Slab).  \n\n|   |\n| - |\n\nSchedule CRM follow-up tasks based on projected plastering date.  \n\n|   |\n| - |\n\n**C2**  \n\n|   |\n| - |\n\nActive / Qualified Lead  \n\n|   |\n| - |\n\nPlastering fully complete; apertures ready for audit.  \n\n|   |\n| - |\n\n1\\. Post contact details in **Daily Leads WhatsApp Group**.  \n\n|   |\n| - |\n\n2\\. Tag designated Regional Sales Owner (see table below).  \n\n|   |\n| - |\n\n3\\. Offer customer a free site audit or showroom visit.  \n\n|   |\n| - |\n\n**C7**  \n\n|   |\n| - |\n\nRouted to Partner (B2F)  \n\n|   |\n| - |\n\nUnserviceable location or partner territory.  \n\n|   |\n| - |\n\nTransfer lead details to authorized Green Fortune partner fabricators. \n\n**If Customer Is Not Familiar with the Brand** \n\n**Agent:** \n\nSir/Ma'am, just to give you a quick idea about Indi Frame, we provide different types of windows and doors based on customer requirements, design preferences, and project needs. Our team can also guide you on which solution/type opt would be most suitable for your project. \n \n**What Is UPVC?** \n**If Customer Asks About uPVC** \n**Agent: UPVC** stands for **Unplasticized Polyvinyl Chloride**. It is a strong, durable, and low-maintenance material commonly used for manufacturing windows and doors. It can provide good insulation and may help reduce outside noise and heat, depending on the overall window or door configuration. \n\n**Quick Explanation** \n\n**Agent:** \n\nBasically, Sir/Ma'am, Indi Frame provides uPVC and aluminum windows and doors in different designs and configurations such as sliding, casement, fixed, tilt & turn, and slide & fold. \n\nYou don't need to worry about the technical details. Our team will understand your requirements and suggest the most suitable option for your project. \n\n**Scenario A: Digital Ad Lead (Fresh Inquiry from Meta, Google, or Website)** \n\n**Context:** The customer filled out an online form expressing interest in windows or doors. They are usually exploring options and want a quick response. \n\n**1. Opening & Permission** \n\n- **Agent:** *\"Hi Sir/Ma'am, am I speaking with Mr./Ms. [Customer Name]? Hi, I'm [Agent Name] calling from IndiFrame uPVC & Aluminum Windows & Doors. We received your enquiry through [Meta/Facebook/Instagram/WhatsApp/Website] regarding windows and doors. I'd like to understand your requirements better and guide you accordingly. Is this a good time to talk?* \n\n* **If Yes:** *\"Thank you so much! I’d love to understand a bit about what you're working on so I can connect you with the right product expert. May I ask you a few quick questions?\"* \n\n**2. Core Requirements & Project Type** \n\n- **Agent:** *\"To start with, are you looking for windows, doors, or both for your property?\"*   \n\n* **Agent:** *\"Is this for a brand-new construction or renovation?\"*   \n\n- **Agent:** *\"And where is the project property located?\"*   \n\n**3. Quantity & Styles** \n\n- **Agent:** *\"Roughly how many windows and doors do you need & Which Type? (Don't worry if you aren't sure—an estimate is totally fine for now!)*\" \n\n* **Agent:** *\"We offer various styles like sliding, casement, fixed, slide & fold, and more.\"* \n\n**4. Timeline, Installation Stage & Decision Makers** \n\n- **Agent:** *\"Approximately when are you planning to get these installed or finalized?\"* \n\n* **If Customer asks about the best stage or timing for installation:** *\"To ensure a flawless fit and avoid any damage from ongoing heavy civil work, we always recommend completing your granite or marble sill laying first. Once your sill work is done, that is the absolute best time for us to step in and install your frames perfectly!\"* \n\n- **Agent:** *\"Will you be making the final purchase call, or will an architect, builder, or family member be involved too?\"* \n\n* **If Yes:** *\"It's great if they can join our consultation, so we make sure everyone's preferences are covered!\"* \n\n**5. Complete Closing, End-to-End Value Proposition & Flexible Follow-Up** \n\n- **Agent:** *\"Thank you, [Customer Name]. That gives me a really clear picture. At IndiFrame, we provide a complete end-to-end service—starting with a free site consultation, followed by free professional measurements by our technical team. We then custom-manufacture everything in our own factory, use our own well-trained installation team for a seamless fit, and back it all up with dependable after-sales service.\"*\n\n- **Agent:** *\"To give you complete confidence in our quality and custom-manufacturing capabilities, we would love to invite you to visit our primary factory unit located at Medchal, Hyderabad. You can inspect our advanced machinery, raw material grades, and fabrication process firsthand.\"* \n\n* **Agent:** *\"Would you like me to set up a free site consultation right away, or would you prefer a callback at a later time?\"* \n\n- **[If customer wants immediate appointment]:** *\"What date and time work best for you?\"*  \n\n* **[Customer provides date/time:** *\"Wonderful! I have noted that date and time for you. Our technical experts will be there to assist you properly.\"* \n\n- **[If customer wants a later callback / is busy, he says:** *\"No problem at all! When would be the best date and time for our sales team to follow up with you?* \n\n* **[Customer provides date/time:** *\"Understood! I have scheduled a follow-up call for that date and time. We will reach out then.\"* \n   \n\n- **Agent (Factory Visit & Experience Centre Options):**\n\n**Factory Visit Invitation (Medchal)**\n\n- **Agent:** *\"To give you complete confidence in our quality and custom-manufacturing capabilities, we would love to invite you to visit our primary factory unit located at Medchal, Hyderabad. You can inspect our advanced machinery, raw material grades, and fabrication process firsthand.\"*\n\n**IndiFrame Experience Centres**\n\n- **Hyderabad – Kukatpally:** 4th floor, 5-35, Vilax Prime, 189-A so our team can share an accurate price range with you? \n\n- **6. Master Response — \"I'm Busy\"** \n\n* **Agent:** \"I completely respect your time, [Customer Name]. I will not keep you long. Since you are busy right now, when would be a better and more convenient time for me to give you a quick callback? \n\n- **7. Master Response — \"Remove My Number\"** \n\n* **Agent:** \"I sincerely apologize for the disturbance, [Customer Name]. I will immediately update our system. Thank you for your time, and I wish you all the best with your project.\" \n\n- **SECTION 2: TIMELINE & PRIORITY RESPONSES** \n\n* **Immediately:** \"Wonderful! Since you need this right away, let us quickly coordinate a site visit or technical check so we can fast-track your measurements and manufacturing.\" \n\n- **Within 1 Month:** \"That is a great timeline. We can schedule a site consultation right away, so your custom frames are ready precisely when your civil work reaches the right stage.\" \n\n* **1–3 Months:** \"That gives us a comfortable window to plan your designs, finalize measurements, and align everything perfectly with your construction schedule.\" \n\n- **3–6 Months:** \"That is helpful to know for your long-term planning. We can stay in touch or schedule a follow-up call closer to your installation timeline, so you don't feel rushed.\" \n\n* **\"Price is the Main Concern\":** \"I completely understand, [Customer Name]. Budget management is vital, and we want to ensure you get the best value without compromising on durability or long-term sealing.\" \n\n- **Already Purchased:** \"Congratulations on your purchase, [Customer Name]! If you ever need assistance with future upgrades or additional spaces, please keep IndiFrame in mind. Have a wonderful day! \n\n* **Project Postponed:** \"No problem at all, [Customer Name]—construction timelines shift. Whenever you are ready to resume, we will be right here to support your project.\" \n\n- **Choose Another Brand:** \"Thank you for letting me know, [Customer Name]. We truly appreciate your time, and if you ever need anything else in the future, please feel free to reach out. \n\n* **SECTION 3: STAGE-WISE FOLLOW-UP & DISPOSITION SCRIPTS** \n\n- **D2. Recap Previous Requirement** \n\n* **Agent:** \"Hello Mr./Ms. [Customer Name], following our previous conversation regarding your project in [Location], I wanted to briefly recap your requirements for [Quantity] units of [Type] to see how we can take the next step.\" \n\n- **D3. Stage — Site Visit Pending** \n\n* **Agent:** \"Hello Mr./Ms. [Customer Name], I am following up regarding your pending site visit. Would you like to schedule our technical expert to visit your property this week to take precise measurements? \n\n- **D4. Stage — Site Visit Completed** \n\n* **Agent:** \"Hello Mr./Ms. [Customer Name], our technical team completed your site visit recently. Have you had a chance to look over the site notes, or would you like to discuss the next steps? \n\n- **D5. Stage — Quotation Shared** \n\n* **Agent:** \"Hello Mr./Ms. [Customer Name], we shared your custom quotation a few days ago. Have you had an opportunity to review it, or do you have any questions about the specifications? \n\n- **D6 / D7. Price is High / Comparing Competitors** \n\n* **Agent:** \"I completely understand, [Customer Name]. When comparing options, it helps to look closely at hardware quality and long-term warranties. Would you like us to review how our factory-engineered systems provide better durability and value? \n\n- **D8 / D9. Needs Time / Family Decision Pending (\"Need to discuss with husband/wife\")** \n\n* **Agent:** \"Take all the time you need, [Customer Name]! It is completely natural to discuss this together. When would be a good day for a quick follow-up after you've had a chance to talk it over? \n\n- **D10. Project is Delayed** \n\n* **Agent:** \"No worries at all, [Customer Name]. Construction delays happen. I will note that your project is temporarily paused and check back in with you at a later date.\" \n\n- **D11. Selected Another Brand (CRM Record: LOST — COMPETITOR)** \n\n* **Agent:** \"Thank you for letting us know, [Customer Name]. If you don't mind sharing our internal feedback, which brand did you end up choosing, and was it primarily due to price, product style, or timeline?\" \n\n- *(CRM Update: Record Competitor Name, Reason Lost: Price / Product / Service / Relationship / Timeline)* \n\n* **D12 / D13. Ready to Proceed / Order Confirmation Pending** \n\n- **Agent:** \"That is fantastic news, [Customer Name]! We are thrilled to partner with you. Let us get your order confirmation finalized so we can begin custom manufacturing your frames at our factory.\" \n\n* **SECTION 4: AGENT CONVERSATION RULES** \n\n- **Do Not Interrogate:** Keep the flow conversational and helpful, never like a rigid questionnaire. \n\n* **One Question at a Time:** Ask a single question and wait for the customer's response before moving forward. \n\n- **Never Argue:** Acknowledge customer concerns with empathy and validates their point of view. \n\n* **Never Promise Unauthorized Discounts:** Stick strictly to official pricing guidelines and company policies. \n\n- **Do Not Overuse Technical Terms:** Keep explanations simple, clear, and easy for the customer to understand. \n\n* **Always Establish the Next Step:** Every call must conclude with a clear and agreed-upon action item. \n\n- **Confirm Before Ending:** Reiterate dates, times, or follow-up details to ensure mutual understanding. \n\n* **Thank the Customer:** Express sincere appreciation for their time and consideration. \n\n**FACTORY VISIT & EXPERIENCE CENTRE CLOSING MODULE**\n\nUse this module whenever the customer wants stronger confidence in manufacturing quality, wants to see products in person, or is evaluating the brand before proceeding.\n\n**Factory Visit Invitation (Medchal)**\n\n- **Agent:** *\"To give you complete confidence in our quality and custom-manufacturing capabilities, we would love to invite you to visit our primary factory unit located at Medchal, Hyderabad. You can inspect our advanced machinery, raw material grades, and fabrication process firsthand.\"*\n\n**IndiFrame Experience Centres**\n\n- **Hyderabad – Kukatpally:** 4th floor, 5-35, Vilax Prime, 189-A, 100 Feet Rd, Prashanti Nagar, I.E, Kukatpally, Hyderabad, Telangana 500072.\n- **Hyderabad – Jubilee Hills:** 82, H.No, 8, Road Number 40, CBI Colony, Jubilee Hills, Hyderabad, Telangana 500033.\n- **Mumbai – Malad West:** Lobby 3, 2nd Floor, Auris Galleria, 218, Kanchpada, Malad West, Mumbai, Maharashtra 400064.\n\n- **Agent:** *\"Would you prefer to visit our Medchal factory, one of our Experience Centres, schedule a site consultation, or have our sales team follow up with you later?\"*\n\n**SECTION 6: GOLDEN CLOSING** \n\n- For a qualified lead, use: \n\n* **Agent:** \"Thank you, Sir/Ma'am. Based on the requirement you've shared, the next best step is [Site Consultation / Medchal Factory Visit / Experience Centre Visit / Sales Discussion]. I've noted your preferred [date/time]. If you would like to visit an Experience Centre, you can choose from our centres in Kukatpally or Jubilee Hills in Hyderabad, or Malad West in Mumbai. We can also arrange a visit to our primary factory unit at Medchal, Hyderabad, so you can see our manufacturing process firsthand. Our team will coordinate the next step with you. Thank you for considering IndiFrame, and we look forward to assisting you with your project.\" \n\n**Final Agent Call Flow Reference** \n\nAssociates should follow this standard workflow across all interactions to maintain consistency: \n\n1. Open the call \n\n2) Introduce IndiFrame Windows & Doors \n\n3. Ask permission to continue \n\n4) Understand: Windows / Doors / Both \n\n5. Understand: uPVC / Aluminum / Need guidance \n\n6) Identify: New construction / Renovation / Replacement \n\n7. Confirm project location \n\n8) Understand approximate quantity \n\n9. Understand type / preference \n\n10) Identify customer priority \n\n11. Confirm project stage (Advising that installation can be done best after granite work) \n\n12) Confirm timeline \n\n13. Identify decision maker \n\n14) Qualify the lead \n\n15. Present the complete end-to-end value proposition (Free consultation, two-stage free measurements, custom factory manufacturing, well-trained installation team, and after-sales service) \n\n16) Offer immediate site consultation/measurements OR Medchal factory visit OR Experience Centre visit OR handle deferred/partner follow-ups based on customer preference \n\n17. Complete sales handoff \n\n18) Update CRM disposition \n\n**Lead Status** \n\n- New Lead \n\n* Connected – Interested \n\n- Connected – Not Interested \n\n* Callback Requested \n\n- Qualified Lead \n\n* Hot Lead \n\n- Warm Lead \n\n* Cold Lead \n\n- Site Visit Scheduled \n\n* Experience Centre Visit Scheduled \n\n- Site Visit Completed \n\n* Quotation Pending \n\n- Quotation Shared \n\n* Quotation Follow-Up \n\n- Negotiation \n\n* Decision Pending \n\n- Order Confirmation Pending \n\n* Won \n\n- Lost \n\n**Lost / Closed Reasons** \n\n- Not Interested \n\n* Wrong Number \n\n- Wrong Lead \n\n* Duplicate Lead \n\n- Already Purchased \n\n* Competitor Selected \n\n- Project Cancelled \n\n* Project Postponed \n\n- Budget Issue \n\n* Price Too High \n\n- Location Not Serviceable \n\n* No Requirement \n\n- Customer Unreachable \n   \n\n**MASTER QUALIFICATION CHECKLIST** \n\nThe agent should try to capture the following information wherever applicable: \n\n1. Customer Name \n\n2) Contact Number \n\n3. Lead Source \n\n4) City \n\n5. Locality \n\n6) Project Address / Landmark \n\n7. Residential / Commercial \n\n8) New Construction / Renovation / Replacement \n\n9. Construction Stage \n\n10) Windows Required \n\n11. Doors Required \n\n12) Approximate Quantity \n\n13. uPVC / Aluminium / Not Decided \n\n14) Product Type / Configuration \n\n15. Primary Requirement \n\n16) Budget Sensitivity \n\n17. Expected Installation Timeline \n\n18) Decision Maker \n\n19. Architect / Contractor / Builder \n\n20) Competitor Status \n\n21. Site Visit Requirement \n\n22) Experience Centre Interest \n\n23. Quotation Status \n\n24) Customer Objection \n\n25. Next Action \n\n26) Next Follow-Up Date \n\n27. Final Lead Disposition \n---\n\n# **SECTION 5: SHARED SCRIPT — PRICE HANDLING, COMPANY FACTS & APPROVED TERMINOLOGY**\n\n## **5.1 Shared Script — Price Handling**\n\n**Customer:** “What is your rate?”\n\n**Agent:** “Happy to help with that, Sir. Just so I give you something useful — is this a new construction or a renovation, and roughly how many windows are you looking at?”";

function escHTML(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderLegacyTables(raw){
 const marker=/\|\s*\|\s*\n\s*\|\s*-\s*\|/g;
 const clean=x=>String(x).replace(/\*\*/g,"").replace(/\*/g,"").replace(/\\\./g,".").replace(/\s+/g," ").trim();
 const specs=[
  {start:"The Six Mandatory Discovery Questions",end:"BRANCH 1: FUTURE LEAD",head:["Parameter","Approved English Question","Expected Output / Control"],cols:3,removeStart:true},
  {start:"BRANCH 1: FUTURE LEAD",end:"PARAMETER CATEGORY",head:["BRANCH 1: FUTURE LEAD","BRANCH 2: ACTIVE LEAD","BRANCH 3: UNSERVICEABLE"],cols:3},
  {start:"PARAMETER CATEGORY",end:"CRM STAGE CLASSIFICATION & HANDOVER MATRIX",head:["PARAMETER CATEGORY","ENFORCEMENT DETAILS"],cols:2,drop:["STANDARD OPERATING PROTOCOL & OPERATIONAL RULES"]},
  {start:"CRM STAGE CLASSIFICATION & HANDOVER MATRIX",end:"If Customer Is Not Familiar with the Brand",head:["STAGE CODE","STAGE DESCRIPTION","QUALIFICATION TRIGGER","REQUIRED NEXT ACTION & ROUTING"],cols:4,removeStart:true,crm:true}
 ];
 for(const spec of specs){
  const at=raw.indexOf(spec.start); if(at<0)continue;
  const next=spec.end?raw.indexOf(spec.end,at+spec.start.length):-1;
  const finish=next>at?next:raw.length;
  const block=raw.slice(at,finish);
  let cells=block.split(marker).map(clean).filter(Boolean);
  if(spec.removeStart)cells=cells.filter(v=>v!==clean(spec.start));
  cells=cells.filter(v=>!(spec.drop||[]).some(d=>v===clean(d)));
  const h=spec.head.map(clean);
  const headerAt=cells.findIndex((v,i)=>h.every((x,j)=>clean(cells[i+j])===x));
  if(headerAt<0)continue;
  const rows=cells.slice(headerAt+h.length);
  let bodyRows=[];
  if(spec.crm){
   for(let i=0;i<rows.length;){
    if(!/^C\d+$/i.test(rows[i])){i++;continue;}
    const code=rows[i++],description=rows[i++]||"",trigger=rows[i++]||"",actions=[];
    while(i<rows.length&&!/^C\d+$/i.test(rows[i]))actions.push(rows[i++]);
    bodyRows.push([code,description,trigger,actions.join("<br>")]);
   }
  }else{
   for(let i=0;i+spec.cols<=rows.length;i+=spec.cols)bodyRows.push(rows.slice(i,i+spec.cols));
  }
  let table='<table class="script-table"><thead><tr>'+h.map(x=>'<th>'+escHTML(x)+'</th>').join('')+'</tr></thead><tbody>';
  for(const group of bodyRows){
   if(group.length===spec.cols)table+='<tr>'+group.map(x=>'<td>'+(spec.crm?String(x).split("<br>").map(escHTML).join("<br>"):escHTML(x))+'</td>').join('')+'</tr>';
  }
  table+='</tbody></table>';
  raw=raw.slice(0,at)+spec.start+'\n'+table+raw.slice(finish);
 }
 return raw;
}
function renderScriptText(raw){
 let rendered=renderLegacyTables(String(raw)),tables=[];let p=0;while((p=rendered.indexOf('<table class="script-table">',p))>=0){let q=rendered.indexOf("</table>",p);if(q<0)break;q+=8;tables.push(rendered.slice(p,q));rendered=rendered.slice(0,p)+"@@SCRIPT_TABLE_"+(tables.length-1)+"@@"+rendered.slice(q);p+=24;}let html=escHTML(rendered);tables.forEach((t,i)=>{html=html.replace("@@SCRIPT_TABLE_"+i+"@@",t);});
 html=html.replace(/^#{1,3}\s+(.+)$/gm,'<h3>$1</h3>');
 html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
 html=html.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
 html='<p>'+html+'</p>';
 html=html.replace(/<p><\/p>/g,'').replace(/<p>(<h3>|<table)/g,'$1').replace(/(<\/h3>|<\/table>)<\/p>/g,'$1');
 return html;
}

function filterList(inputId,listId){let q=document.getElementById(inputId).value.toLowerCase();document.getElementById(listId).querySelectorAll(".item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none")}
function searchCX(id){let el=document.getElementById(id||"homeSearch");let q=el.value.trim();if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}}
function scriptTab(btn){document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let t=btn.innerText.toLowerCase();document.querySelectorAll(".list .item").forEach(x=>{let s=x.innerText.toLowerCase();let ok=t==="all scripts"||(t.includes("discovery")&&/discovery|qualification/.test(s))||(t.includes("pricing")&&/pricing|budget/.test(s))||(t.includes("objection")&&/objection/.test(s))||(t.includes("brand")&&/brand|product/.test(s))||(t.includes("timeline")&&/timeline|priority/.test(s))||(t.includes("follow")&&/follow/.test(s))||(t.includes("scenario")&&/scenario/.test(s))||(t.includes("rules")&&/rules|protocol/.test(s))||(t.includes("closing")&&/closing|handover/.test(s));x.style.display=ok?"":"none"})}
function fav(x){let a=JSON.parse(localStorage.getItem("ifFav")||"[]");if(!a.includes(x))a.push(x);localStorage.setItem("ifFav",JSON.stringify(a));alert("Added to My Quick Access")}
function unfav(x){localStorage.setItem("ifFav",JSON.stringify(JSON.parse(localStorage.getItem("ifFav")||"[]").filter(y=>y!==x)));render()}
function copy(x){navigator.clipboard&&navigator.clipboard.writeText(x);alert("Copied")}
document.getElementById("searchBtn").onclick=()=>{let q=prompt("Search the Agent Help Desk");if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("searchBtn").click()}});
render();
</script></body></html>
