references, and project needs. Our team can also\n\nguide you on which solution/type opt would be most suitable for your project.\n\nWhat Is UPVC?\n\nAgent: UPVC stands for Unplasticized Polyvinyl Chloride. It is a strong, durable, and low-maintenance\n\nmaterial commonly used for manufacturing windows and doors. It can provide good insulation and may\n\nhelp reduce outside noise and heat, depending on the overall window or door configuration.\n\nQuick Explanation\n\nAgent: Basically, Sir/Ma'am, Indi Frame provides uPVC and aluminum windows and doors in different\n\ndesigns and configurations such as sliding, casement, fixed, tilt & turn, and slide & fold. You don't need to\n\nworry about the technical details. Our team will understand your requirements and suggest the most\n\nsuitable option for your project.\n\nMANDATORY RENOVATION RULE – EXISTING WINDOWS & DOORS\n\n\nWhenever the customer says the project is a renovation, the agent MUST follow this sequence:\n\n   1. Confirm the existing windows and doors: Ask whether the customer will remove/uninstall the\n         existing windows and doors before IndiFrame work starts.\n<PARSED TEXT FOR PAGE: 3 / 16>\n   2. Make the requirement clear: Explain in simple words that the existing windows and doors must be\n      removed by the customer/their team before IndiFrame can start its work.\n   3. Confirm acceptance: Ask the customer if this arrangement is okay.\n   4. If the customer agrees: Ask for the expected date and time when the existing windows and\n      doors will be removed / the site will be ready for installation.\n   5. Ask for follow-up timing: Confirm a convenient date and time for IndiFrame to follow up and\n      coordinate the next step.\n   6. Do not confirm installation before the existing windows and doors are removed.\n\nApproved Customer Conversation:\n\nAgent: Since this is a renovation project, I’d like to confirm one important point. The existing windows and\ndoors will need to be removed before our work starts. Will you be able to get the existing windows and\ndoors removed before we begin?\n\nCustomer: Yes\n\n\nAgent: Great. Approximately when do you expect the existing windows and doors to be removed and the\nsite to be ready for our installation work?\n\nCustomer: [Date / Time] {After This have To Collect the Details as Per Script}\n\nAgent: Thank you. And what would be a convenient date and time for our team to follow up with you and\ncoordinate the next steps?\n\n\nIf Customer: [Follow-up Date / Time]\n\nAgent: Perfect. I’ve noted the site-readiness date and your preferred follow-up time. We will connect with\nyou accordingly.\n1 If the customer has NOT agreed to remove the existing windows and doors:\n\nAgent: No problem at all. However, please note that our team does not provide uninstalling services. We\ncan only start our installation work after the existing windows and doors have been completely removed\nby your team. May I please get your final confirmation that you understand and can arrange the\nUninstallation?\n\nCustomer: Must Decide\n\n\nAgent: Understood ___ Sir, May I Know what a convenient date and time for our team would be to follow\nup with you and coordinate the next steps?\n\nIf Customer: [Follow-up Date / Time]\n\nAgent: Perfect. I’ve noted the site-readiness date and your preferred follow-up time. We will connect with\nyou accordingly.\n\n\n\nCustomer: No\n\nAgent: Understood. Whenever you have completed removing the existing windows and doors and your\nsite is ready, you can call us back or reach us through the contact number (9959083498) mentioned on our\nwebsite. We’ll be happy to take the next steps with you!\n\n\n\nABUSIVE / INAPPROPRIATE LANGUAGE\n\n1st Attempt:\n\n\"I would request you to kindly use professional language.\"\n\n2nd Attempt:\n\n\n\"I would request you to kindly use professional language.\"\n\nClosing:\n\n\"As there is no positive response from your side, your call is being disconnected. Thank you for\nconsidering IndiFrame. We look forward to assisting you whenever you are ready. Have a wonderful day\nahead.\n\n2. BLANK CALL / NO RESPONSE (UNRESPONSIVE CUSTOMER)\n\n1st Attempt:\n\n\"Good morning, this is [Agent Name], calling from IndiFrame Windows and Doors,\n\n2nd Attempt:\n\n\" Good morning, this is [Agent Name], calling from IndiFrame Windows and Doors, please respond if you\nare on the call.\"\n\nClosing (If no response):\n<PARSED TEXT FOR PAGE: 4 / 16>\n\"As there is no response, the call is being disconnected. Thank you for considering IndiFrame. We look\nforward to assisting you whenever you are ready. Have a wonderful day ahead.\n\nCUSTOMER PUT ON HOLD (EXTENDED HOLD / UNATTENDED)]\n\n\n\n\n1st Attempt:\n\n\"As customer putted the call on hold, I have to disconnect the call forcefully.\"\n\n2nd Attempt:\n\n\"As the customer put the call on hold, I have to disconnect the call forcefully. Please respond if you are on\nthe call.\n\nClosing:\n\n\"As there is no response from your side, your call is being disconnected. Thank you for considering\nIndiFrame. We look forward to assisting you whenever you are ready. Have a wonderful day ahead.\n\n\n\nCustomer Does Not Answer / Call Is Forwarded to Voicemail\n\nAgent:\n“Hello, this is Mahesh calling from IndiFrame Windows and Doors regarding your enquiry. Please call us\nback at your convenience. Thank you.”\n\n\n\n4. Scenario A – Digital Ad Lead\n\nContext: Fresh enquiries from Meta, Google, Website, WhatsApp, or another digital channel.\n\nA1. Opening & Permission\n\nAgent:\n“Good evening, Sir, I am calling from IndiFrame, a premium brand in high-quality uPVC and Aluminum\nproducts/windows and doors. We received your enquiry regarding Windows & Doors on\n[Facebook/Instagram/WhatsApp/Website. Is this a good time for a quick Conversation?”\n\n\n\n\nA2. Core Requirement & Project Type\n\nAgent: Are you looking for windows or doors for your property?\n\nAgent: Is this for a new construction or renovation?\n\nAgent: Is this project for your residential home or commercial property?\n\nAgent: Which specific city and area/locality is your construction site located in?\n\n\n\n\nA3. Quantity, Material & Style\n\nAgent: How many windows and doors do you need? A rough count is completely fine for now.\n\n\n\nAgent: Do you have any type of windows and doors in your mind, such as sliding, casement, fixed, tilt &\nturn, or slide & fold?\n\n\n\nA4. Construction Stage, Readiness & Timeline..\n\nAgent: What stage is the site currently in — foundation, brickwork, plastering, or finishing?\n\nAgent: Approximately when are you planning to finalize or install the windows and doors?\n\nAgent: As a planning point, installation is best done after the granite or marble sill work is completed. Has\nthat work been completed at the site yet?\n\nIf Customer Wants Installation Before Granite/Marble Sill Work.\n\nCustomer: “I want the windows installed after plastering, before the granite/marble work.”\n\nAgent:\n“Sure, I’ll note it. Our sales team will check the site condition and confirm the suitable installation stage\nwith you.”\n\n\n\n\nA5. Decision Maker\n\nAgent: Will you be making the final purchase decision, or will an architect, builder, contractor, designer,\nor family member also be involved?\n<PARSED TEXT FOR PAGE: 5 / 16>\nIf others are involved:\n\nAgent:\n“If they are involved, it would be helpful if they could be part of the consultation so we can understand\neveryone’s requirements.”\n\n\n\n\nA6. Customer Questions / VOC\nAfter the qualification questions, the customer may have questions before deciding on the next step.\n\nCustomer: “Why should I buy from IndiFrame?”\n\nAgent:\n“IndiFrame is a pan-India brand, headquartered in Hyderabad. We provide uPVC and Aluminum\nwindows and doors, supported by a professional measurement team, well-trained installation team and\ndedicated after-sales service team. We follow an end-to-end process from measurement and\nmanufacturing to installation and after-sales support.”\n\n\n\n\nCustomer: “What are the benefits of using uPVC?”\n\nAgent:\n“uPVC is one of the window and door material options we provide. If you are considering uPVC, our team\ncan understand your project requirements and guide you on the suitable product and configuration based\non your application.”\n\nImportant: The agent should not add technical benefits that are not covered in the approved IndiFrame\nproduct material. Specific technical claims should be handled by the relevant sales/technical team.\n\n\n\n\nCustomer: “Why is your price high?”\n\nAgent:\n“I understand your concern regarding the price. The final price depends on the product, size,\nconfiguration, quantity, hardware, and other project requirements. Our team can understand your exact\nrequirement and explain the pricing accordingly.”\n\nAgent should not:\n\n      Promise a discount.\n      Compare pricing with competitors without approved information.\n      Give an unsupported final quotation.\n      Commit to a special price.\n\n\n\n\nCustomer: “Your competitor is offering it for less. Why should I choose IndiFrame?”\n\nAgent:\n“I understand. Pricing can vary depending on the product configuration, size, hardware and overall\nproject requirements. Our Sales Team can understand what you are comparing and explain the relevant\nIndiFrame offering and pricing for your project.”\n\n\n\n\nCustomer: “What makes IndiFrame different?”\n\nAgent:\n“We focus on an end-to-end process, including professional measurement, manufacturing, installation\nand after-sales service. We also use high-quality European machinery for manufacturing and have\ndedicated teams supporting the customer throughout the process.”\n\n\n\n\nCustomer: “Do you provide installation?”\n\nAgent:\n“Yes. We have a well-trained installation team, and our team will coordinate the installation based on the\nsite condition and the suitable installation stage.”\n\n\n\n\nCustomer: “Do you provide after-sales service?”\n\nAgent:\n“Yes. We have a dedicated service team for after-sales support.”\n\n\n\n\nCustomer: “Where are you located?”\n\nAgent:\n“IndiFrame is a pan-India brand, headquartered in Hyderabad. We are currently providing our services\n<PARSED TEXT FOR PAGE: 6 / 16>\nacross Andhra Pradesh, Maharashtra, and Telangana. We also have Experience Centers in Hyderabad and\nMumbai.”\n\nIf required:\n“Our team can guide, you regarding the Experience Centre most convenient for you.”\n\n\n\n\nCustomer: “Can I see your products before deciding?”\n\nAgent:\n“Certainly. You can visit our Experience Centre and explore the available product options and discuss\nyour project requirements with our team.”\n\n\n\n\nCustomer: “Can I visit your factory?”\n\nAgent:\n“Certainly. A factory visit can also be coordinated. Our team can guide you regarding the visit and help\nyou understand more about our manufacturing process and product range.”\n\n\n\n\nCustomer: “Can you give me the price now?”\n\nAgent:\n“We can understand your requirements and arrange for our Sales Team to discuss the pricing with you.\nThe final pricing depends on the specific requirements of your project.”\n\n\n\n\nCustomer: “Can you give me a discount?”\n\nAgent:\n“I understand your concern. Our Sales Team can discuss the applicable pricing for your specific\nrequirement.”\n\n\n\n\nCustomer: “How long will installation take?”\n\nAgent:\n“The installation timeline depends on the project requirements and site readiness. Our Sales Team will\nassess the requirement and coordinate the next steps with you.”\n\n\n\n\nA7. Closing – Based on Customer VOC\nAgent:\n“Thank you, Customer Name. That gives me a clear understanding of your requirements. Just to confirm,\nyou are looking for [Quantity & Type] windows and [Quantity & Type] doors for your\n[Residential/Commercial] project in [Location].\n\nBefore I proceed, may I know what would be convenient for you as the next step? Would you like to\ndiscuss your requirement with our Sales Team, arrange a Site Consultation, visit our Experience Centre, or\nwould you prefer a callback at a convenient date and time?”\n\nIf Customer agrees to proceed:\n\nAgent:\n“Certainly, Customer Name”. I’ll note your preferred next step as [Customer’s Requirement]. Our team\nwill coordinate with you regarding [Date/Time, if applicable] and take the discussion forward.”\n\nIf Customer wants some time / a later call:\n\nAgent:\n“Sure, Customer Name”. What date and time would be convenient for us to reach out to you?”\n\nAgent:\n“Perfect. I’ve noted [Date] at [Time]. Our team will contact you as discussed.”\n\nIf Customer is not interested / says No:\n\nAgent:\n“Certainly, Customer Name”. I understand. May I know if there is any reason for your decision, so I can\nnote your feedback correctly?”\n\nIf Customer shares the reason:\n\nAgent:\n“Understood. I’ve noted your feedback. Thank you for sharing that with us.”\n\nIf Customer does not want to share the reason:\n\nAgent:\n“I understand. Thank you for your time.”\n<PARSED TEXT FOR PAGE: 7 / 16>\nFinal Closing:\n\nAgent:\n“Thank you for considering IndiFrame. We look forward to assisting you whenever you are ready. Have a\nwonderful day ahead.”\n\n\n\n\n5. Scenario B – Field Spotted Lead\nContext: Lead collected through field sales, an active construction site, a site visit, or walk-by interaction.\n\nB1. Opening & Permission\nAgent:\nGood morning. I am calling on behalf of Indiframe Windows and Doors, a premium brand specializing in high-\nquality UPVC and Aluminum Product/Windows and Doors. Am I speaking with Mr./Ms. [Customer Name]? Our field\nofficer Mr./Ms. [Name] recently noted your construction work at [Location]. Since your site is under construction, is\nthis a good time to ask a few questions to understand your requirements and guide you properly?\n\n\n\nB2. Requirement & Existing Field Information\n\n  Collecting info when spotter details aren’t available :\n\n  Agent: Are you currently looking for windows or doors f pport.\n\nAgent: Just to confirm again, you are looking for [Quantity & Type] windows and [Quantity & Type] doors for your\n[Residential/Commercial] project at [Location], and you would like to connect with our        sales team to coordinate\nthe site consultation and discuss the next steps with you.\n\nAgent: What would be a convenient date and time for our sales team to contact you about the site consultation?\n\nCustomer: [Date & Time]\n\nAgent: Perfect, [Customer Name]. I’ve noted the follow-up for [Date] at [Time]. Our sales team will connect with you\non that date and at that time to arrange the site consultation and assist you with the next steps.\n\nAgent: Thank you for considering IndiFrame. We look forward to assisting you with your project. Have a wonderful\nday ahead.\n\nB5. Closing – Sales Callback\n<PARSED TEXT FOR PAGE: 8 / 16>\nIf Customer Wants an Immediate Sales Callback\nCustomer: I would like someone from sales to call me.\n\nAgent: Sure, Customer Name. Thank you for sharing your requirement. At IndiFrame, we custom-make our products\nin our own factory, use our own trained installation team, and provide reliable after-sales service.\n\nAgent: Just to confirm again, you are looking for [Quantity & Type] windows and [Quantity & Type] doors for your\n[Residential/Commercial] project in [Location], [Customer Name] & you would like to discuss [Requirement/Concern]\nwith our sales team.\n\n\nIf Customer Didn’t Said for Immediate Call Back\n\n\nAgent: Sir, would you like to discuss [Requirement/Concern] with our sales team?\n\nCustomer: Yes, [Immediate].\n\nAgent: Sure, Sir/Ma’am. You can expect a call from our sales team within the next one hour. Thank you for\nconsidering IndiFrame. We look forward to assisting you with your project. Have a wonderful day ahead.\n\n\n\n\nIf Customer Wants the Sales Team to Call at a Specific Date & Time\nCustomer: Can you call me later?\n\nAgent: Sure, Customer Name. I can easily arrange a callback for you. What date const scriptCategories=["Final Scripts","Secondary Scripts","Hindi Roman Script","Telugu Roman Scripts"];
function escapeScriptText(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderScriptDocument(source){
 const lines=String(source||"").replace(/\r/g,"").split("\n");
 let html="",i=0;
 const cell=(v)=>escapeScriptText(v.trim()).replace(/\n/g,"<br>");
 while(i<lines.length){
  const line=lines[i],trim=line.trim();
  if(!trim){i++;continue;}
  if(line.includes("\t")){
   const rows=[];
   while(i<lines.length&&lines[i].includes("\t")){
    const cells=lines[i].split("\t").map(x=>x.trim());
    if(cells.some(Boolean))rows.push(cells);
    i++;
   }
   if(rows.length){
    const cols=Math.max(...rows.map(r=>r.length));
    html+='<div class="script-table-wrap"><table class="script-table"><tbody>';
    rows.forEach((r,ri)=>{html+='<tr>'+Array.from({length:cols},(_,ci)=>{const v=r[ci]||"";return ri===0?'<th>'+cell(v)+'</th>':'<td>'+cell(v)+'</td>'}).join("")+'</tr>'});
    html+='</tbody></table></div>';
   }
   continue;
  }
  if(/^(\d+(?:\.\d+)*[.)]?\s+|Scenario [A-E0-9]|[A-E]\d+\.\s)/i.test(trim)||(/^[A-Z][^.!?]{2,85}$/.test(trim)&&trim===trim.toUpperCase())){
   html+='<h3 class="script-heading">'+escapeScriptText(trim)+'</h3>';
  }else if(/^(Agent|Customer|Customer asks|Agent answers|Context|Rule|Important|Mandatory closing rule|If the customer|If Customer|If customer|Sample exchange)/i.test(trim)){
   html+='<p class="script-dialogue">'+escapeScriptText(trim)+'</p>';
  }else if(/^([•·▪]|[-*] )/.test(trim)){
   html+='<p class="script-bullet">'+escapeScriptText(trim)+'</p>';
  }else{
   html+='<p class="script-paragraph">'+escapeScriptText(trim)+'</p>';
  }
  i++;
 }
 return '<article class="script-document">'+html+'</article>';
}

  return H("SCRIPT LIBRARY",scriptCategory,sourceReady?"Complete source script · Structured tables and readable sections":"Conversational Roman-language translation")+

 }

}
