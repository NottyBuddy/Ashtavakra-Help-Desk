const scriptLibrary={"Final Scripts":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nINDIFRAME WINDOWS & DOORS\n\nINDIFRAME WINDOWS & DOORS\nFinal Pre-Sales Call Script\n\tStep\n\tWhat the agent does\n\n\t1. Open\n\tIntroduce yourself naturally, Use the opening for the lead type: Digital Ad (A), Field Spotted (B), Expo / Event (C), Follow-Up (D), Outside Service Area (E).\n\n\t2. Discover\n\tAsk the six mandatory discovery questions one at a time and acknowledge each answer.\n\n\t3. Check coverage and readiness\n\tDecide C0, C1, C2 or C7 only after the coverage and construction-stage checks.\n\n\t4. Agree the next step\n\tConfirm the requirement, the responsible team, the action, the date and the time.\n\n\t5. Close\n\tUse the Golden Closing (Section 20) and complete the Mandatory Closing Check.\n\n\t6. Log and hand over\n\tUpdate the CRM with the exact disposition on the same day. For C2 leads, post in the Daily Leads WhatsApp group and tag the Regional Sales Owner (Section 22).\n\n\n2. Golden Rules\n1. Treat every call like a helpful consultation, not a rigid questionnaire.\n1. Ask one question at a time and let the customer respond before continuing.\n1. Listen actively, acknowledge concerns and keep a supportive tone throughout.\n1. Keep explanations simple and avoid unnecessary technical terms.\n1. Do not criticise competitors or local fabricators. Redirect to IndiFrame’s value.\n1. Do not promise unauthorised discounts, exact delivery dates, structural approvals, wind-load calculations, mm-level specifications, chamber counts or any other detail that needs technical validation. Defer these to Sales and the technical site team.\n1. Every connected call must end with a clear, agreed next action.\n1. Before ending, reconfirm the requirement and the agreed action, team, date and time wherever applicable.\n1. Installation is best planned after granite or marble sill work is completed. This helps ensure a proper fit and reduces the risk of site damage.\n1. Use “experience centre”, never “showroom”. Use “free site consultation”, never “site measurement” or “site visit”. Say “warranty”, never “guarantee”. Say “we’ll fix it”, never “we’ll replace it”.\n3. Protected Accounts \n\tRule\n\tDetail\n\n\tProhibited\n\tOutbound qualification or dialling on protected accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh or Ravi Boliipogu is strictly prohibited.\n\n\tWhy\n\tThese are high-value corporate/project accounts managed directly at management level.\n\n\tCheck\n\tVerify every lead against the Key Account List before the first call.\n\n\n4. Daily Workflow\n1. System readiness check and availability set-up.\n1. Protected account pre-check against the Key Account List.\n1. New (C0) lead: after the protected account check, review the lead and make the first call immediately.\n1. Future (C1) lead: follow up on the scheduled date and update the CRM activity.\n1. Active (C2) lead: contact the customer and confirm whether they have received a call from the Sales Team. If yes, record it in the CRM activity. If not, document it in the CRM and share the customer’s details and concern in the designated WhatsApp group with the concerned salesperson for immediate follow-up.\n1. Initiate the outbound call and run the script opening (Scenario A, B, C, D or E).\n1. Ask the six mandatory discovery questions.\n1. Evaluate construction stage and location serviceability.\n1. After every call, record what the customer said, their concerns and the key points in the CRM activity, then share the relevant details and concerns in the WhatsApp group with the concerned salesperson.\n1. If the customer asks for a callback: write the request and follow-up details in the CRM activity, create a CRM task for the requested date and time, assign it properly, follow up on time and update the CRM with the outcome.\n1. Return to Ready status for the next lead.\n5. The Six Mandatory Discovery Questions\nComplete all six before assigning the lead stage, wherever the conversation allows. Ask them conversationally, not as a form.\n\tParameter\n\tApproved question\n\tExpected output\n\n\t1. Project Type\n\tIs this project for your personal residential home or commercial property?\n\tResidential / Commercial / Villa / Apartment\n\n\t2. Site Location\n\tWhich specific city and area/locality is your construction site located in?\n\tArea name + PIN code; verify serviceability\n\n\t3. Stakeholder Role\n\tAre you managing the build directly, or working with an architect or interior designer?\n\tSelf / Architect / Civil Contractor / Designer\n\n\t4. Construction Stage\n\tWhat stage is the site currently in: Foundation, Brickwork, Plastering or Finishing?\n\tFoundation / Brickwork / Plastering / Interiors\n\n\t5. Quantity Estimate\n\tApproximately how many window and door openings do you need to cover?\n\tEstimated window and door count\n\n\t6. Aperture Readiness\n\tHave internal and external plastering been completed around all window openings?\n\tYes (ready) / No (in progress)\n\n\nAlways verify site readiness by confirming the construction stage. The openings must be built and plastering completed. Do not arrange a sales consultation at the site before plastering is complete.\nIf the customer cannot provide a count: “No problem, Sir/Ma’am. Is the requirement for a two-bedroom home, a three-bedroom home or a full independent house?”\nSample exchange (readiness not yet reached)\nAgent: Is the internal and external plastering complete around every opening?\nCustomer: Not yet. It should be ready in about three weeks.\nAgent: Thanks. What date and time would suit you for a follow-up around then? I’ll note it. We’ll review readiness at that time; this is not an installation booking.\n6. Lead Stages, Pricing and Operating Rules\n6.1 CRM stage classification and handover\n\n\tStage\n\tDescription\n\tQualification trigger\n\tRequired next action and routing\n\n\tC0\n\tNew unqualified lead\n\tInitial lead ingestion from marketing channels\n\tMake call attempt 1 immediately on assignment.\n\n\tC1\n\tFuture potential lead\n\tFoundation, slab, brickwork, structural, granite work or plastering incomplete\n\tSchedule a CRM follow-up based on the projected plastering / readiness date. For uPVC enquiries, quote the starting rate of ₹450/sq ft onwards plus GST. Route aluminium enquiries to Sales without providing prices, specifications or timelines.\n\n\tC2\n\tActive / qualified lead\n\tPlastering fully complete; openings ready\n\tPost the customer’s contact details in the Daily Leads WhatsApp group and tag the designated Regional Sales Owner (Section 22). For uPVC enquiries, quote the starting rate; route aluminium enquiries to Sales without providing prices, specifications or timelines. Offer a free site consultation or an Experience Centre visit.\n\n\t\n\t\n\t\n\tUpdate the lead status as 'Won' in the CRM, initiate the order processing / manufacturing handover, and share the confirmation details with the customer.\n\n\t\n\t\n\t\n\tRecord the specific reason for loss in the CRM, update lead status to 'Lost', and schedule a long-term nurturing or feedback follow-up if applicable.\n\n\tC4\n\tWon Lead\n\tPayment Done, Manufacturing started\n\tUpdate the lead status as 'Won' in the CRM, initiate the order processing / manufacturing handover, and share the confirmation details with the customer.\n\n\tC6\n\tLost Lead\n\tLost Due To Specific Reasons\n\tRecord the specific reason for loss in the CRM, update lead status to 'Lost', and schedule a long-term nurturing or feedback follow-up if applicable.\n\n\tC7\n\tRouted to partner (B2F)\n\tSite outside direct IndiFrame coverage, or partner territory\n\tOffer the authorised Green Fortune partner route (Scenario E). Transfer lead details to the partner and log C7 / ROUTE TO B2F in the CRM. Do not promise full IndiFrame service on partner leads.\n\n\n\n6.2 Pricing rule\n\tRule\n\tDetail\n\n\tThe only price you may say\n\tFor the standard uPVC specification: “Prices start from ₹450 per sq ft onwards, plus 18% GST.” Route all aluminium pricing enquiries to Sales; do not quote a rate for aluminium.\n\n\tStrict red line\n\tNo custom calculations, single-window estimates, totals, per-window rates or discounts. Do not calculate prices during initial qualification.\n\n\tIncluded in the rate\n\tThe window or door, installation by our own team, and after-sales service. The starting rate covers the standard specification: white colour, clear glass and the 60 series. Other colours, other glass and other systems go to Sales for pricing.\n\n\tCharged separately\n\tGST at 18% and transport (depends on location and order size). Never estimate transport or say it can be waived.\n\n\tAny other price question\n\t“I’ll have our Sales Team connect with you. They’ll take you through all of that properly.”\n\n\n6.3 Warranty (authorised statements only)\n\tItem\n\tAuthorized statement\n\n\tProfile\n\t15 years\n\n\tHardware\n\t5 years operational warranty\n\n\tColour\n\t7 years on solid grey and solid black; 15 years on solid white; 20 years on laminated finishes\n\n\tAnything else\n\tSay nothing about exclusions, claim procedure or any coverage beyond the figures above. Hand over to Sales.\n\n\n6.4 Technical and scope boundaries\nNever commit to exact delivery dates, mm-level specifications, chamber counts, wind-load calculations, glass thickness, decibel ratings, or whether a specific design is possible. You may say delivery is “typically three to four weeks”. Defer everything technical to the site consultation and the technical team.\n6.5 Unreachable leads: retry cadence\nFor unanswered calls, complete the mandatory retry cadence before archiving the lead. A maximum of 15 call attempts across 9 calendar days is permitted. Vary the calling times to improve the likelihood of reaching the customer. Record the exact disposition after every attempt. Never edit the C-stage manually.\n\tDay \n\tAttempts \n\tCalling schedule \n\tDay \n\tAttempts \n\tCalling schedule \n\n\tDay 1 \n\t3 \n\tImmediately on assignment, afternoon and evening \n\tDay 6 \n\t1 \n\tEvening \n\n\tDay 2 \n\t2 \n\tMorning and evening \n\tDay 7 \n\t2 \n\tMorning and evening \n\n\tDay 3 \n\t2 \n\tAfternoon and evening \n\tDay 8 \n\t1 \n\tA different time slot from previous attempts \n\n\tDay 4 \n\t2 \n\tMorning and evening \n\tDay 9 \n\t1 \n\tFinal attempt in a suitable time slot, then archive if unanswered \n\n\tDay 5 \n\t1 \n\tA different time slot from previous attempts \n\tTotal \n\t15 \n\tAcross 9 calendar days\n\n\n7. Service Coverage and Experience Centres\n\tState\n\tCity / cluster\n\tOn-ground coverage\n\tStatus\n\n\tMaharashtra\n\tMumbai and MMR\n\tExperience Centre (Malad West) + field executives\n\tServiced\n\n\tMaharashtra\n\tAlibag, Karjat, surrounding MMR belt\n\tCovered from Mumbai\n\tSizeable projects only\n\n\tMaharashtra\n\tPune\n\tField executive\n\tServiced\n\n\tMaharashtra\n\tNagpur and Chandrapur\n\tField executive\n\tServiced\n\n\tTelangana\n\tHyderabad\n\tExperience Centre (Kukatpally); Jubilee Hills flagship opening soon\n\tServiced\n\n\tTelangana\n\tKhammam\n\tChannel partner display; field executive being added\n\tServiced\n\n\tTelangana\n\tKarimnagar and Siddipet\n\tField executive\n\tServiced\n\n\tTelangana\n\tWarangal\n\tChannel partner display and field executive being covered from Hyderabad\n\tSizeable projects only\n\n\tTelangana\n\tNizamabad, Mahbubnagar\n\tTag the regional owner\n\tSales confirms serviceability\n\n\tAndhra Pradesh\n\tVijayawada, Guntur, Amaravathi\n\tChannel partner display and field executive being added\n\tSizeable projects only\n\n\tAndhra Pradesh\n\tVisakhapatnam, Rajahmundry, Kakinada, Tirupati, Nellore\n\tTag the regional owner\n\tSales confirms serviceability\n\n\tAndhra Pradesh\n\tKurnool\n\tChannel partner display (Varaahi Enterprises)\n\tServiced\n\n\tAndhra Pradesh\n\tAnantapur / Kadapa\n\tCovered from Kurnool\n\tSizeable projects only\n\n\tAndhra Pradesh\n\tOngole\n\tProposed\n\tConfirm with Sales\n\n\tAndhra Pradesh\n\tEluru / Bhimavaram\n\tCovered from Vijayawada / Rajahmundry once set up\n\tSizeable projects only\n\n\tAndhra Pradesh\n\tSrikakulam / Vizianagaram\n\tTo be decided\n\tSizeable projects only\n\n\tPan-India\n\tAny location\n\tProject-led\n\tLarge-scale orders only\n\n\n7.2 Experience centres and displays\n\n\tCity\n\tLocation\n\tType\n\tStatus\n\n\tHyderabad\n\tKukatpally: 4th Floor, 5-35, Vilax Prime, 189-A, 100 Feet Road, Prashanti Nagar, I.E., Kukatpally, Hyderabad 500072\n\tIndiFrame Experience Centre\n\tLive\n\n\tHyderabad\n\tJubilee Hills, Road No. 36 (flagship)\n\tIndiFrame Experience Centre\n\tOpening soon. Sales will share the date.\n\n\tHyderabad\n\tHome 360, Jubilee Hills (Road No. 40)\n\tChannel partner display\n\tLive\n\n\tMumbai\n\tAuris Galleria, 218, Kanchpada, Malad West, Mumbai 400064\n\tIndiFrame Experience Centre\n\tLive\n\n\tKurnool\n\tVaraahi Enterprises, Nandikotkur Road\n\tChannel partner display\n\tLive\n\n\tKhammam\n\tFuture Living Interior & Architecture, Sri Sri Circle\n\tChannel partner display\n\tLive\n\n\nAlways offer the experience centre when a customer asks about colour, hardware or glass. These are decisions made with hands and eyes. Confirm availability with the team before the customer travels.\n8. Special Call Situations\n\tSituation\n\t1st attempt\n\t2nd attempt\n\tClosing\n\n\tAbusive or inappropriate language\n\t“I would request you to kindly use professional language.”\n\t“I would request you to kindly use professional language.”\n\t“As the inappropriate language has continued, I will now end the call. Thank you for considering IndiFrame. We look forward to assisting you whenever you are ready. Have a good day.”\n\n\tBlank call / no response\n\t“Good morning, this is [Agent Name], calling from IndiFrame Windows and Doors.”\n\t“Good morning, this is [Agent Name], calling from IndiFrame Windows and Doors. Please respond if you are on the call.”\n\t“As I have not received a response, I will now end the call. Thank you for considering IndiFrame. We look forward to assisting you whenever you are ready. Have a good day.”\n\n\tCustomer put the call on hold\n\t“As the customer has put the call on hold, I have to disconnect the call.”\n\t“As the customer has put the call on hold, I have to disconnect the call. Please respond if you are on the call.”\n\t“As I have not received a response while the call is on hold, I will now end the call. Thank you for considering IndiFrame. We look forward to assisting you whenever you are ready. Have a good day.”\n\n\nCustomer does not answer / voicemail\nAgent: “Hello, this is [Agent Name] calling from IndiFrame Windows and Doors regarding your enquiry. Please call us back at your convenience. Thank you.”\n9. Mandatory Renovation Rule: Existing Windows and Doors\nWhenever the customer says the project is a renovation, follow this sequence.\n\tStep\n\tAction\n\n\t1\n\tAsk whether the customer will remove the existing windows and doors before IndiFrame’s work starts.\n\n\t2\n\tExplain in simple words that the existing windows and doors must be removed by the customer or their team before IndiFrame can start. IndiFrame does not provide uninstalling services.\n\n\t3\n\tAsk whether this arrangement is acceptable.\n\n\t4\n\tIf yes, ask the expected date and time when the old windows and doors will be removed and the site will be ready for installation.\n\n\t5\n\tConfirm a convenient date and time for IndiFrame to follow up and coordinate the next step.\n\n\t6\n\tDo not confirm installation before the existing windows and doors are removed.\n\n\nIf the customer agrees\nAgent: Since this is a renovation project, I’d like to confirm one important point. The existing windows and doors will need to be removed before our work starts. Will you be able to get them removed before we begin?\nCustomer: Yes.\nAgent: Great. Approximately when do you expect the existing windows and doors to be removed and the site to be ready for our installation work?\nCustomer: [Date / Time]\nAgent: Thank you. And what would be a convenient date and time for our team to follow up with you and coordinate the next steps?\nCustomer: [Follow-up date / time]\nAgent: Perfect. I’ve noted the site-readiness date and your preferred follow-up time. We will connect with you accordingly.\nIf the customer has not yet agreed\nAgent: No problem at all. However, please note that our team does not provide uninstalling services. We can only start our installation work after the existing windows and doors have been completely removed by your team. May I please get your confirmation that you understand and can arrange the removal?\nCustomer is undecided:\nAgent: Understood, Sir. May I know a convenient date and time for our team to follow up with you and coordinate the next steps?\nCustomer gives a follow-up date and time:\nAgent: Perfect. I’ve noted the site-readiness date and your preferred follow-up time. We will connect with you accordingly.\nCustomer says No:\nAgent: Understood. Whenever you have completed removing the existing windows and doors and your site is ready, you can call us back or reach us on 9959083498, the contact number on our website. We’ll be happy to take the next steps with you.\n10. Scenario A: Digital Ad Lead\nContext: fresh enquiries from Meta, Google, Website, WhatsApp or another digital channel.\nA1. Opening and permission\nAgent: Good [morning/afternoon/evening], Sir/Ma’am. I'm [Agent Name], calling from IndiFrame, a premium brand offering high-quality uPVC and aluminium windows and doors.\nWe received your enquiry through Facebook (Instagram / WhatsApp / Website) regarding windows and doors. Is this a good time to have a quick conversation?\nA2. Core requirement and project type\nAgent: Are you looking for windows or doors for your property?\nAgent: Is this for a new construction or a renovation? (If renovation, apply Section 9.)\nAgent: Is this project for your residential home or a commercial property?\nAgent: Which specific city and area/locality is your construction site located in?\nA3. Quantity, material and style\nAgent: How many windows and doors do you need? A rough count is completely fine for now.\nAgent: Do you have any type in mind, such as sliding, casement, fixed, tilt and turn, or slide and fold? (If they ask which to choose, that is a handover to Sales.)\nA4. Construction stage, readiness and timeline\nAgent: What stage is the site currently in: foundation, brickwork, plastering or finishing?\nAgent: Approximately when are you planning to finalize or install the windows and doors?\nAgent: As a planning point, installation is best done after the granite or marble sill work is completed. Has that work been completed at the site yet?\nIf the customer wants installation before granite/marble sill work\nCustomer: “I want the windows installed after plastering, before the granite/marble work.”\nAgent: “Sure, I’ll note that. Our Sales Team will check the site condition and confirm the suitable installation stage with you.”\nA5. Decision maker\nAgent: Will you be making the final purchase decision, or will an architect, builder, contractor, designer or family member also be involved?\nIf others are involved: “It would be helpful if they could be part of the consultation so we can understand everyone’s requirements.” Capture their names and numbers.\nA6. Customer questions (voice of customer)\nAfter qualification the customer may ask questions before agreeing a next step. Use Section 16 for the full question and objection library. The most common are:\n\tCustomer asks\n\tAgent answers\n\n\tWhy should I buy from IndiFrame?\n\t“IndiFrame is a pan-India brand, headquartered in Hyderabad. We provide uPVC and aluminium windows and doors, supported by a professional measurement team, a well-trained installation team and a dedicated after-sales service team. We follow an end-to-end process from measurement and manufacturing to installation and after-sales support.”\n\n\tWhat are the benefits of uPVC?\n\t“uPVC is one of the window and door material options we provide. If you are considering uPVC, our team can understand your project requirements and guide you on the suitable product and configuration.” Do not add technical benefits that are not in approved IndiFrame material.\n\n\tWhy is your price high?\n\t“I understand your concern regarding the price. The final price depends on the product, size, configuration, quantity, hardware and other project requirements. Our team can understand your exact requirement and explain the pricing accordingly.”\n\n\tYour competitor is offering it for less.\n\t“I understand. Pricing can vary depending on the product configuration, size, hardware and overall project requirements. Our Sales Team can understand what you are comparing and explain the relevant IndiFrame offering and pricing for your project.”\n\n\tWhat makes IndiFrame different?\n\t“We focus on an end-to-end process: professional measurement, manufacturing, installation and after-sales service, with dedicated teams supporting you throughout.”\n\n\tDo you provide installation?\n\t“Yes. We have a well-trained installation team, and our team will coordinate the installation based on the site condition and the suitable installation stage.”\n\n\tDo you provide after-sales service?\n\t“Yes. We have a dedicated service team for after-sales support.”\n\n\tWhere are you located?\n\t“IndiFrame is a pan-India brand, headquartered in Hyderabad. We currently provide our services across Andhra Pradesh, Maharashtra and Telangana. We have Experience Centres in Hyderabad and Mumbai. Our team can guide you to the one most convenient for you.”\n\n\tCan I see your products before deciding?\n\t“Certainly. You can visit our Experience Centre, explore the product options and discuss your project requirements with our team.”\n\n\tCan I visit your factory?\n\t“I’ll note your request for a factory visit, Sir. Our Sales Team will call you back and confirm it with you.” Log the request and tag the regional owner. Never confirm or refuse it yourself.\n\n\tCan you give me the price now?\n\t“We can understand your requirements and arrange for our Sales Team to discuss the pricing with you. The final pricing depends on the specific requirements of your project.” If they press for a rate, give the starting rate only (Section 6.2).\n\n\tCan you give me a discount?\n\t“I understand your concern. Our Sales Team can discuss the applicable pricing for your specific requirement.” Never offer, hint at or imply a discount.\n\n\tHow long will installation take?\n\t“The installation timeline depends on the project requirements and site readiness. Our Sales Team will assess the requirement and coordinate the next steps with you.” Never give a date.\n\n\nAgent must not: promise a discount, compare pricing with competitors without approved information, give an unsupported final quotation, or commit to a special price.\nA7. Closing based on the customer’s response\nAgent: “Thank you, [Customer Name]. That gives me a clear understanding of your requirements. Just to confirm, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location].”\nAgent: “Before I proceed, what would be convenient for you as the next step? Would you like to discuss your requirement with our Sales Team, arrange a site consultation, visit our Experience Centre, or would you prefer a callback at a convenient date and time?”\n\tIf the customer\n\tAgent says\n\n\tAgrees to proceed\n\t“Certainly, [Customer Name]. I’ll note your preferred next step as [requirement]. Our team will coordinate with you regarding [date/time, if applicable] and take the discussion forward.”\n\n\tWants time / a later call\n\t“Sure, [Customer Name]. What date and time would be convenient for us to reach out to you?” Then: “Perfect. I’ve noted [date] at [time]. Our team will contact you as discussed.”\n\n\tIs not interested\n\t“Certainly, [Customer Name]. I understand. May I know if there is any reason for your decision, so I can note your feedback correctly?”\n\n\tShares the reason\n\t“Understood. I’ve noted your feedback. Thank you for sharing that with us.”\n\n\tDoes not want to share\n\t“I understand. Thank you for your time.”\n\n\nFinal closing: “Thank you for considering IndiFrame. We look forward to assisting you whenever you are ready. Have a wonderful day ahead.”\n11. Scenario B: Field Spotted Lead\nContext: a lead collected through field sales, an active construction site, a site visit or a walk-by interaction. Before calling, review the CRM notes or MIS to understand the site details and the field officer’s observations. Use this information to make the conversation relevant and informed.\nB1. Opening and permission\nAgent: “Good [morning/afternoon], I am calling on behalf of IndiFrame Windows and Doors, a premium brand specialising in high-quality uPVC and aluminium windows and doors. Am I speaking with Mr./Ms. [Customer Name]? From Our field Team [Name] recently noted your construction work at [location]. Since your site is under construction, is this a good time to ask a few questions to understand your requirements and guide you properly?”\nB2. Requirement and existing field information\nIf spotter details are not available, collect:\nAgent: Are you currently looking for windows or doors for this project, and could you please share the rough quantity and type you need?\nAgent: Are you considering uPVC, aluminium, or would you like our team to guide you?\nAgent: Do you have specific styles in mind, such as sliding, casement, fixed, tilt and turn, or slide and fold?\nIf spotter details are available, confirm:\nAgent: Our notes indicate a requirement for [quantity and type of windows and doors] and an interest in [type]. Is that still correct?\nAgent: Just to confirm, the project is located at [location], is that correct?\nB3. Site stage and decision maker\nIf spotter details are not available, collect:\nAgent: What stage is the site currently in: foundation, brickwork, plastering or finishing?\nAgent: When do you expect the project to reach the windows and doors installation stage?\nAgent: As a planning point, installation is best done after granite or marble sill work is completed. Has that work been completed yet?\nAgent: Will you be making the final decision, or will an architect, builder, contractor, designer or family member also be involved?\nConfirm what you have collected:\nAgent: Just to confirm, the site is currently at [site stage], and you are making the final decision, or you will be coordinating with [architect / family] for the final decision. Is that correct?\nB4. End-to-end value proposition\nAgent: “Based on your project, how would you like to proceed? Would you prefer a sales team callback, a site consultation or an Experience Centre visit?”\nB5. Closing: site consultation\nCustomer: I would like a site consultation.\nAgent: Sure, [Customer Name]. Thank you for sharing your requirement. At IndiFrame we provide a free site consultation, free professional measurement, custom-made manufacturing in our own factory, trained installation and reliable after-sales support.\nAgent: Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project at [location], and you would like to connect with our Sales Team to coordinate the site consultation and discuss the next steps.\nAgent: What would be a convenient date and time for our Sales Team to contact you about the site consultation?\nCustomer: [Date and time]\nAgent: Perfect, [Customer Name]. I’ve noted the follow-up for [date] at [time]. Our Sales Team will connect with you then to arrange the site consultation and assist you with the next steps. Thank you for considering IndiFrame. We look forward to assisting you with your project. Have a wonderful day ahead.\nB6. Closing: sales callback\n\tIf the customer\n\tAgent says\n\n\tWants a callback now\n\t“Sure, [Customer Name]. Thank you for sharing your requirement. At IndiFrame we custom-make our products in our own factory, use our own trained installation team and provide reliable after-sales service.” Then confirm: “Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like to discuss [requirement/concern] with our Sales Team.”\n\n\tHas not asked for an immediate callback\n\t“Sir, would you like to discuss [requirement/concern] with our Sales Team?” If yes: “Sure, Sir/Ma’am. You can expect a call from our Sales Team within the next one hour.”\n\n\tWants a call later\n\t“Sure, [Customer Name]. I can easily arrange a callback. What date and time is convenient?” Then: “Perfect. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like our Sales Team to contact you about [requirement/concern] on [date] at [time]. I’ve noted the details, and our Sales Team will connect with you then.”\n\n\nFinal closing: “It was a pleasure speaking with you. Thank you for trusting IndiFrame with your project. Have a great day!”\n12. Scenario C: Expo / Event Lead\nContext: the customer visited an IndiFrame display, exhibition or public event.\nC1. Opening and permission\nAgent: “Good [morning/afternoon], I am calling on behalf of IndiFrame Windows and Doors, a premium brand specialising in high-quality uPVC and aluminium windows and doors. Am I speaking with Mr./Ms. [Customer Name]? We noted that you visited our display at [Event Name] held on [Event Date] at [Event Location]. Is this a good time for a quick conversation?”\nAgent: “Since you explored our products at the event, I wanted to understand your window and door requirements so we can assist you properly. May I ask you a few quick questions?”\nC2. Requirement and existing event information\nAgent: Are you currently looking for windows, doors or both for your project?\nAgent: Our event notes mention [quantity] units and interest in [type]. Is that still correct?\nAgent: Just to confirm, the project is located at [location], correct?\nAgent: Are you considering uPVC, aluminium, or would you like our team to guide you?\nAgent: Do you have specific styles in mind, such as sliding, casement, fixed, tilt and turn, or slide and fold?\nAgent: What is the main priority for your project: appearance, ventilation, natural light, sound reduction, ease of operation, security, heat reduction or privacy?\nC3. Project stage and decision maker\nAgent: Is this a new construction or an upcoming renovation? (If renovation, apply Section 9.)\nAgent: What stage is the project currently in: foundation, brickwork, plastering or finishing?\nAgent: Have internal and external plastering been completed around the window openings?\nAgent: When do you expect the project to reach the window and door installation stage?\nAgent: As a planning point, installation is best done after granite or marble sill work is completed. Has that work been completed yet?\nAgent: Will you be making the final decision, or will an architect, builder, contractor, designer or family member also be involved?\nC4. End-to-end value proposition\nAgent: “Based on your project, how would you like to proceed? Would you prefer a sales team callback, a site consultation or an Experience Centre visit?”\nC5. Closing options\n\tCustomer choice\n\tAgent script\n\n\tSite consultation\n\t“Sure, [Customer Name]. Thank you for sharing your requirement. At IndiFrame we provide a free site consultation, free professional measurement, custom-made manufacturing in our own factory, trained installation and reliable after-sales support. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project at [location], and you would like our Sales Team to arrange the site consultation. What would be a convenient date and time for them to contact you?” Then: “Perfect, [Customer Name]. I’ve noted the follow-up for [date] at [time]. Our Sales Team will connect with you then to arrange the site consultation and assist you with the next steps.”\n\n\tImmediate sales callback\n\t“Sure, [Customer Name]. At IndiFrame we custom-make our products in our own factory, use our own trained installation team and provide reliable after-sales service. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like to discuss [requirement/concern] with our Sales Team. You can expect a call from them within the next one hour.”\n\n\tCallback at a specific time\n\t“Sure, [Customer Name]. I can easily arrange a callback. What date and time are convenient?” Then reconfirm the requirement and: “Our Sales Team will connect with you on [date] at [time] to assist you with the next steps.”\n\n\tExperience Centre visit\n\t“Wonderful, [Customer Name]. Just to reconfirm, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location]. You have chosen to visit our [Kukatpally / Malad West] Experience Centre. What would be a convenient date and time?” Then: “Perfect. I’ve noted your preferred visit for [date] at [time]. Our team will coordinate with you and assist you during your visit. You’ll have an opportunity to explore our product options and discuss your project requirements with our team.”\n\n\tAsks to visit the factory\n\t“I’ll note your request for a factory visit, [Customer Name]. Our Sales Team will call you back and confirm the visit with you.” Log the request in the CRM and tag the regional owner. The agent does not invite, confirm or refuse a factory visit.\n\n\nFinal closing: “It was a pleasure speaking with you. Thank you for trusting IndiFrame with your project. Have a great day!”\n13. Scenario D: Stage Follow-Up / Warm Lead / Construction Delay\nContext: an existing lead where the customer was waiting on construction progress, budget, timing or a decision. Always give a reason for the call.\nD1. Opening and permission\nAgent: “Good [morning/afternoon]. I am calling on behalf of IndiFrame Windows and Doors, a premium brand specialising in high-quality uPVC and aluminium windows and doors. We spoke about [number of days/weeks] ago about your window and door requirements for [project/location]. I wanted to quickly check in and understand how your project is moving along. Is this a good time?”\nAgent: “Thank you. Have there been any recent updates on the construction or renovation?”\nD2. Confirm the previous requirement\nAgent: According to our notes from our last conversation, you were looking at [quantity] units of [type]. Have there been any changes to the requirement or quantity?\nAgent: Have you had a chance to review the details or quotation from our side, or is there anything specific you are evaluating right now?\nD3. Construction delay and stage advice\nAgent: No problem at all. Construction timelines can change. Just as a helpful planning point, we recommend scheduling window and door installation after the granite or marble sill work is completed. What stage are your walls and sills at now, and when do you expect to reach that point?\nD4. Budget and price discussion\nAgent: I understand, [Customer Name]. Budget management is an important part of any project. Are you comparing our quotation with another branded provider or a local vendor? Understanding what you are evaluating will help our team guide you properly.\nAgent: IndiFrame focuses on complete value through professional consultation, measurement, custom-made manufacturing, trained installation and after-sales support.\nD5. End-to-end value proposition\nAgent: “Based on your project, how would you like to proceed? Would you prefer a sales team callback, a site consultation or an Experience Centre visit?”\nD6. Closing: future follow-up\nAgent: Thank you, [Customer Name]. That gives me a clear picture of your current requirements. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like our [Sales / concerned] team to discuss [concern/requirement].\nAgent: Our team will follow up with you on [date] at [time]. I’ve noted this as discussed, and we’ll keep you updated on the next steps. Thank you for your time today. We look forward to assisting you when you are ready.\nD7. Closing: immediate site consultation\nAgent: Thank you, [Customer Name]. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors at [location]. Our Sales Team will follow up with you on [date] at [time] to arrange the site consultation and next steps. Thank you for considering IndiFrame. We look forward to assisting you with your project. Have a good day.\n14. Scenario E: Location Outside Direct Service Area (Green Fortune Partner)\nContext: the site is outside IndiFrame’s direct installation coverage and must be routed to an authorised Green Fortune partner fabricator. Log as C7 / ROUTE TO B2F.\nBe open about serviceability. On serviceability the customer gains by knowing. Do not promise full IndiFrame service on partner leads. Partner fabricators work with our material and will look after the customer locally.\nE1. Opening and permission\nAgent: “Good [morning/afternoon]. I am calling on behalf of IndiFrame Windows and Doors, a premium brand specialising in high-quality uPVC and aluminium windows and doors, about your enquiry. Is this a good time for a quick conversation? May I ask you a few quick questions?”\nE2. Requirement and existing enquiry information\nAgent: Are you currently looking for windows, doors or both for this project?\nAgent: Our enquiry details mention [quantity] units and interest in [type]. Is that still correct?\nAgent: Just to confirm, the project is located at [customer location], correct?\nAgent: Are you considering uPVC, aluminium, or would you like the technical team to guide you?\nAgent: Do you have specific styles in mind, such as sliding, casement, fixed, tilt and turn, or slide and fold?\nAgent: “Thank you. I understand your project is located in [Customer Location]. Our direct installation services are currently available in selected locations. However, we can connect you with our Green Fortune team, which provides local support through fabricators in your area.\nThey can assist you with your window and door requirements using our products and materials. Would you like us to arrange a follow-up call from our team to discuss the next steps?\n\nIf the customer raises a price concern here, handle it as in Section 16. Never present Green Fortune or a fabricator as a cheaper way to buy the same product.\nE3. Site stage and decision maker\nAgent: Is this for a new construction or renovation?\nAgent: What stage is the project currently in: foundation, brickwork, plastering or finishing?\nAgent: When do you expect the project to reach the window and door installation stage?\nAgent: As a planning point, installation is best done after granite or marble sill work is completed. Has that work been completed yet?\nAgent: Will you be making the final decision, or will an architect, builder, contractor, designer or family member also be involved?\nE4. End-to-end value proposition\nAgent: “Based on your project, how would you like to proceed? Would you prefer a partner follow-up call, a sales team callback, or an IndiFrame brochure?”\nE5. Closing: partner transition\nAgent: I understand your project is located in [Customer Location]. Our direct installation services are currently available in selected locations. However, we can connect you with our Green Fortune team, which provides local support through fabricators in your area.\nThey can assist you with your window and door requirements using our products and materials. Would you like us to arrange a follow-up call from our team to discuss the next steps?\n\nCustomer: Yes.\nAgent: Certainly, [Customer Name]. The partner team can review your project requirements and guide you on the next steps.\nAgent: Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like the partner team to discuss [requirement/concern] with you.\nAgent: You can expect a call from the concerned partner team within the next one hour. They will assist you with your requirements and guide you through the next steps.\nAgent: “It was a pleasure speaking with you. Thank you for trusting IndiFrame with your project. Have a great day!”\nE6. Closing: immediate partner callback\nCustomer: “I would like someone to call me.”\nAgent: “Certainly, [Customer Name]. I will note your requirements right away and arrange for the concerned Green Fortune partner team to connect with you shortly.”\nCustomer: How soon can I expect the call?\nAgent: “You can expect a call from the concerned partner team within the next one hour. They will assist you with your requirements and guide you through the next steps.” Then reconfirm the requirement as in E5.\nE7. Closing: specific partner follow-up\nCustomer: Can you call me later?\nAgent: Sure, [Customer Name]. I’d be happy to arrange a callback with the concerned partner team. What would be the most convenient date and time for them to contact you?\nCustomer: [Date and time]\nAgent: Perfect, [Customer Name]. Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location], and you would like the concerned Green Fortune partner team to contact you about [requirement/concern] on [date] at [time]. I’ve noted the details as discussed, and the partner team will connect with you then.\nAgent: “We sincerely thank you for considering IndiFrame. Please let us know if you need anything else as you get started. Have a great day ahead.”\nGenuine price mismatch: the customer states a firm budget well below our range and closes the conversation, or does not want GST billing. Close warmly. Do not offer an alternative or mention Green Fortune, profiles or fabricators. Log C7 / Route to Fabricator with the reason; this entry records the mismatch and does not mean that an alternative or referral has been offered to the customer.\n“That’s clear, Sir. Thank you for being straightforward with me. At that budget we may not be the right fit, and I’d rather tell you honestly than waste your time. I’ll note your requirement in our system. If anything changes, do keep us in mind.”\n15. About IndiFrame: Simple Answers\n\tCustomer asks\n\tAgent answers\n\n\tWhat is IndiFrame? Where is it?\n\t“IndiFrame is a pan-India brand, Sir/Ma’am, headquartered in Hyderabad, and our manufacturing is in Hyderabad too. We currently provide our services across Andhra Pradesh, Maharashtra and Telangana. In Hyderabad we have an Experience Centre at Prashanti Nagar, Kukatpally, and another is opening soon in Jubilee Hills. In Mumbai we have an Experience Centre at Malad West. Depending on your location, our local team will support you throughout the process.” For Maharashtra customers, add the Mumbai office and the Mumbai, Pune and Nagpur service team.\n\n\tWhat does IndiFrame do?\n\t“IndiFrame provides uPVC and aluminium windows and doors based on customer requirements, design preferences and project needs. Our team can understand your site, guide you on suitable options and support you from consultation to the next step.”\n\n\tWhat is uPVC?\n\t“uPVC stands for unplasticised polyvinyl chloride. It is a strong, durable, low-maintenance material commonly used for windows and doors. Depending on the overall configuration, it can provide good insulation and may help reduce outside noise and heat.”\n\n\tWeren’t you Green Fortune earlier?\n\t“Yes, Sir, we were. Green Fortune is our profile brand, the material we supply to fabricators. As our finished windows business grew, we gave it its own identity, IndiFrame. Same company, same factory, same team. Green Fortune supplies the material; IndiFrame builds, delivers and installs the complete window for you.” Never say “we changed our name”.\n\n\tQuick explanation (customer not familiar with the brand)\n\t“Basically, Sir/Ma’am, IndiFrame provides uPVC and aluminium windows and doors in different designs and configurations such as sliding, casement, fixed, tilt and turn, and slide and fold. You don’t need to worry about the technical details. Our team will understand your requirements and suggest the most suitable option for your project.”\n\n\n16. Customer Objections and Trigger Responses\nUse ACE on every objection: Acknowledge the customer’s concern; Clarify it by asking one question; Establish the next step—a consultation, Experience Centre visit, callback, or WhatsApp information followed by a callback. Never argue, repeat the same pitch more forcefully or criticise a competitor.\n16.1 Why IndiFrame\n\tCustomer says\n\tAgent responds\n\n\tWhy should I choose IndiFrame?\n\t“That is a very valid question, [Customer Name]. We provide a complete, organised process: professional consultation, suitable product guidance, standardised manufacturing, trained installation support, warranty support and after-sales service. We are headquartered in Hyderabad and serve Andhra Pradesh, Maharashtra and Telangana, so our local team can support you based on your project location.”\n\n\tWhy IndiFrame instead of a local fabricator?\n\t“I understand, [Customer Name]. Local fabricators may look cheaper at first, but with IndiFrame you get a more structured process: product guidance, professional measurement, standardised manufacturing, trained installation, warranty support and after-sales service. This gives you one organised team for the project.”\n\n\tWhat makes IndiFrame different?\n\t“IndiFrame focuses on giving customers clarity and confidence. We help you understand the right product type, take the project stage into account, guide you on site readiness and connect you with the suitable team for measurement, consultation, an Experience Centre visit or a sales discussion.”\n\n\tWill IndiFrame help me choose the right type?\n\t“Yes, absolutely. You don’t need to decide everything on your own. Our team will understand your requirement, location, opening size, usage, design preference and project stage, and then suggest suitable options such as sliding, casement, fixed, tilt and turn, or slide and fold.”\n\n\tCan I see the products before deciding?\n\t“Yes, [Customer Name]. You can visit our Experience Centre to see the product options, understand the finish and operation, and discuss your requirement with our team. We can guide you to the nearest one.”\n\n\tWill I get support after installation?\n\t“Yes, Sir/Ma’am. IndiFrame provides after-sales support along with applicable warranty support. If you need help after installation, our team will guide you through the correct support process.”\n\n\tIs IndiFrame suitable for premium homes or villas?\n\t“Yes, [Customer Name]. IndiFrame can support residential homes, villas, apartments and commercial projects. Our team will understand your design expectation, usage requirement and site condition before recommending the suitable product type and next step.”\n\n\n16.2 Price and competition\n\tCustomer says\n\tAgent responds\n\n\tI only want the price. / What’s the rate per sq ft?\n\t“I understand that pricing is important. Our range starts from ₹450 per square foot onwards, plus 18% GST. The exact number depends on the type of windows, the sizes and the quantity, so I wouldn’t want to give a figure that turns out to be wrong. Our team can do a free site consultation and give you an exact quotation, with no obligation. Would that be useful?” Never lead with price. If asked first, understand the requirement for thirty seconds, then give the range.\n\n\tYour price is high.\n\t“I understand, Sir. For windows it’s better to compare the complete solution, not only the price per square foot: profile, glass, hardware, locking system, installation, warranty and long-term performance. May I understand what matters most to you: price, noise reduction, security, appearance, ventilation or durability?”\n\n\tLocal fabricators are much cheaper.\n\t“I understand, Sir/Ma’am. The price difference is a valid consideration. When reviewing the quotation, please check whether the written warranty identifies the company and GST number, specifies the hardware and glass, and includes installation or only the windows. Our team can provide a line-by-line comparison with the quotation, with no obligation.”\n\n\tThe fabricator says he uses the same profile as you.\n\t“That is a good profile, Sir/Ma’am. The profile is one part of the complete window. The fabricator selects the internal steel, hardware, glass, gaskets and installation method. The fabricator, rather than the profile company, provides the warranty for the finished window. Our team can explain what to check.”\n\n\tI’m also considering Fenesta / Aparna Venster / Weatherseal / AIS.\n\t“Those are good companies, Sir. You’re comparing the right kind of option. We’re in the same category: our own factory, our own installation team and a warranty in writing. Customers usually find the difference in pricing and in how flexible we can be on design and finish. Would you like our team to give you a comparison?” Then hand over. Do not attempt a feature-by-feature comparison.\n\n\tGive me your best price / a discount.\n\t“Our team will provide an exact quotation after the free site consultation, Sir/Ma’am, with no obligation. Pricing depends on the sizes and types required, so I cannot provide an accurate quotation at this stage. I’ll share your details with the team so they can assist you personally.” Record the pricing request and hand it over to Sales.\n\n\tI want a quotation and I can share my measurements.\n\t“Sure, [Customer Name]. Please share the measurements you have, in any format: width and height for each window or door, with the quantity and type if known. We’ll pass them to our technical team for an initial review. Our consultation team will also take the final, precise measurements at your site before finalising the quotation.” Then: “Thank you. I’ll make a note of this, and our consultation team will review your measurements and reach out shortly for the next steps.”\n\n\tMy budget is only ₹[low number] per sq ft and it is final.\n\tGenuine mismatch. Use the mismatch close in Section 14 and log Route to Fabricator. If the customer is still talking, treat it as an objection and hand to Sales.\n\n\tI’m worried about the price / price is the main concern.\n\t“I understand, [Customer Name]. Budget management is important, and our team can help you understand the overall value and available options without compromising the suitability of the solution.”\n\n\n16.3 Timing and decision\n\tCustomer says\n\tAgent responds\n\n\tJust send me the details on WhatsApp.\n\t“Of course, Sir/Ma’am. I’ll share the details right away. To ensure I send the relevant information, is this for a full house or a few rooms? I’ll share the information now and follow up in a couple of days after you have reviewed it.” Send the details and log the callback so the follow-up is not missed.\n\n\tI’ll call you when I’m ready.\n\t“Absolutely, Sir. Roughly when do you think plastering will be done? I’ll make a note and check in around then. And if you’d like to see the products before that, our Experience Centre is open any day.”\n\n\tI’m just exploring / haven’t decided anything yet.\n\t“That is completely fine, [Customer Name]. Planning your windows early can help avoid rushed decisions later. May I take a few basic details so we can guide you when you are ready?”\n\n\tMy site isn’t ready. Call me later.\n\t“No problem, Sir. We’d rather come at the right stage. Roughly when will plastering be done? I’ll call you around then. Meanwhile, if you’d like to see the products, our Experience Centre is open.”\n\n\tI need to discuss with my family.\n\t“Please take the time you need, [Customer Name]. It would help if they could join the consultation too, so we understand everyone’s requirement. When would everyone be available? I’ll arrange a time then.”\n\n\tMy architect / contractor will arrange the windows.\n\t“Understood, Sir/Ma’am. Would it be helpful for us to share our range and pricing process with your architect or contractor directly? Supply, installation and warranty are provided by one company. May I have their contact number, or would you prefer that I send you the details to forward?” This may be a qualified lead with a different decision maker, rather than a rejection. Capture the relevant contact details.\n\n\tI’ve already decided on someone else. / I chose another brand.\n\t“Understood, Sir. May I ask who you went with, and was the decision mainly price, product style, service, relationship or timeline? That helps us record your feedback correctly. If anything changes, please keep IndiFrame in mind.” Log the competitor and the reason.\n\n\tI’m busy.\n\t“I understand, [Customer Name]. I’ll take only two minutes, or when would be a better time for our team to call you back?” Then: “Perfect, I’ve noted [time].”\n\n\tI already purchased.\n\t“Congratulations on your purchase, [Customer Name]. If you need windows or doors for any future project or additional space, please keep IndiFrame in mind. Thank you for your time.”\n\n\tThe project is postponed.\n\t“No problem, [Customer Name]. Construction timelines can change. I’ll note that the project is postponed, and when you are ready to resume, our team will be happy to assist you.”\n\n\n16.4 Trust and product\n\tCustomer says\n\tAgent responds\n\n\tuPVC is plastic. It will break and turn yellow.\n\t“It’s not ordinary plastic, Sir. It’s a rigid engineered material with galvanised steel running inside the frame. The strength comes from the steel, and the uPVC keeps heat and noise out. Ours is UV-stabilised for Indian sun, and you have a 15-year warranty on the profile.”\n\n\tI had a bad experience with uPVC earlier.\n\t“I’m sorry to hear that, Sir/Ma’am. May I understand what went wrong? Issues often relate to the window components or installation, including steel, hardware, gaskets and fitting. We manufacture and install our products ourselves and provide a written warranty. Our team can explain the details to review.”\n\n\tAluminium is better than uPVC / uPVC is better than aluminium.\n\t“Both are options we provide, Sir, and which suits you depends on your project. Our Sales Team can explain and guide you. May I arrange a call?” Never talk down either material.\n\n\tWhat if you shut down? Who will give service later?\n\t“That’s a fair question, Sir. We’re a brand of a pan-India company with our own factory, a formal service process and a digital warranty card in the company’s name. If anything needs attention, you call us and our service team comes.”\n\n\tI don’t want to visit. Can you show me on video?\n\t“Our Sales Team can take you through the options, Sir, and share details on WhatsApp. I’ll arrange a call. When is a good time?”\n\n\tDelivery takes too long in your industry.\n\t“We’re one of the fastest, Sir, typically three to four weeks. Our team will confirm the exact timeline for your order.” Never give a date.\n\n\n16.5 Call-handling objections\n\tCustomer says\n\tAgent responds\n\n\tWhy do you need my location?\n\t“I understand why you ask, [Customer Name]. We request the location so we can check service coverage for your area, assign the appropriate local team and arrange site measurement and installation support.”\n\n\tHow did you get my number?\n\tDigital lead: “Your number was registered through the enquiry source where you expressed interest in windows and doors, which is why we’re calling.” Spotted lead: “Our team member visited your site at [location], Sir. We cover construction sites in the area to see if anyone needs windows. If this isn’t the right time, I’ll note it and won’t disturb you.”\n\n\tI never enquired. Why are you calling?\n\t“I’m sorry if that’s the case, Sir. We received an enquiry on [channel] with this number. If it’s not you, I’ll note it and remove it. Or if you are planning windows, I’d be glad to help for two minutes.”\n\n\tI am not interested.\n\t“Certainly, Sir, I understand. May I know if there is any reason, so I can note your feedback correctly? … Thank you. If anything changes, please keep IndiFrame in mind.”\n\n\tRemove my number. / Don’t call me again.\n\t“I’m sorry for the disturbance, [Customer Name]. I’ll update the system as discussed, and you won’t receive further calls from us. Thank you for your time, and I wish you all the best with your project.”\n\n\tWhy do you keep calling? You called yesterday too.\n\t“I apologise, Sir. I’ll note the best time for you so we don’t disturb you. When would be convenient for a short call, or would you prefer WhatsApp?”\n\n\tTalk to my contractor, here is his number.\n\t“Thank you, Sir. May I know his name, and may I tell him you asked us to call? I’ll call him and also keep you informed.”\n\n\tCan I talk to someone senior or the owner?\n\t“Certainly, Sir. I’ll note your request and our Sales Team will arrange for the right person to call you. What time suits you?”\n\n\n17. Timeline and Priority Responses\n\tCustomer’s timeline\n\tAgent responds\n\n\tImmediately\n\t“Great. Since you need this now, we can arrange with the relevant team for the next step, after site readiness and technical confirmation.”\n\n\tWithin 1 month\n\t“That is a helpful timeline. We can plan the consultation and the next steps around your construction schedule.”\n\n\t1 to 3 months\n\t“That gives us a comfortable window to plan the consultation, designs, measurements and next steps around your construction schedule.”\n\n\t3 to 6 months\n\t“That is helpful to know. We can keep in touch and arrange a follow-up closer to your installation timeline so you can plan comfortably.”\n\n\n18. Stage-Wise Follow-Up Scripts\n\tStage\n\tAgent script\n\n\tD2: Recap of previous requirement\n\t“Hello Mr./Ms. [Customer Name], following our previous conversation about your project in [location], I wanted to briefly recap your requirement for about [quantity] units of [type] and understand how we can take the next step.”\n\n\tD3: Site consultation pending\n\t“Hello Mr./Ms. [Customer Name], I’m following up on your pending site consultation. Would you like us to arrange a convenient date and time for our team to visit your property and take the required measurements?”\n\n\tD4: Site consultation completed\n\t“Hello Mr./Ms. [Customer Name], our team recently completed the site consultation. Have you had a chance to review the site’s details, or would you like our team to discuss the next steps with you?”\n\n\tD5: Quotation shared\n\t“Hello Mr./Ms. [Customer Name], we shared your quotation recently. Have you had a chance to review it, or is there anything specific you would like our team to clarify?”\n\n\tD6 / D7: Price high / comparing competitors\n\t“I understand, [Customer Name]. When comparing options, it helps to consider product suitability, hardware, installation, warranty support and long-term service. Would you like our team to go through the quotation and address your specific concern?”\n\n\tD8 / D9: Needs time / family decision pending\n\t“Please take the time you need, [Customer Name]. It is normal to discuss the decision with your family. When would be a convenient date and time for our team to follow up after you have discussed it?”\n\n\tD10: Project delayed\n\t“No worries, [Customer Name]. Construction delays happen. I’ll note that your project is temporarily paused. When would be a suitable date for our team to check back with you?”\n\n\tD11: Selected another brand\n\t“Thank you for letting us know, [Customer Name]. If you are comfortable sharing, which brand did you select, and was the decision mainly based on price, product, service, relationship or timeline?”\n\n\tD12 / D13: Ready to proceed / order confirmation pending\n\t“That is excellent news, [Customer Name]. We are pleased to move forward with you. Our relevant team can now arrange the order confirmation and next steps for custom-made manufacturing.”\n\n\n19. Experience Centre Module\nAgent: “Would you prefer to visit one of our Experience Centres, schedule a site consultation, or have our Sales Team follow up with you later?”\n\tRule\n\tDetail\n\n\tOffer\n\tOffer the Experience Centre whenever the customer asks about colour, hardware or glass. It is our strongest invitation.\n\n\tWhich centre\n\tKukatpally (Hyderabad) and Malad West (Mumbai) are live. Jubilee Hills (Road No. 36) is opening soon; say “opening soon, our team will share the date”. Never give a date.\n\n\tHandover\n\tAn Experience Centre visit is a strong qualification outcome. Handle it like a site consultation: hand to Sales and tag the area owner in the Daily Leads group.\n\n\tFactory visit\n\tIf a customer asks to visit the factory (Medchal), note the request, tag the regional owner and let Sales confirm. The agent does not invite, confirm or refuse.\n\n\n20. Golden Closing: Standard for Every Connected Call\nAgent: “Thank you, [Customer Name]. That gives me a clear understanding of your requirements.”\nAgent: “Just to confirm again, you are looking for [quantity and type] windows and [quantity and type] doors for your [residential/commercial] project in [location].”\nCustomer (probable): “Yes, that’s correct.”\nAgent: “Your next step is [Sales Team callback / site consultation / Experience Centre visit / partner follow-up], and the follow-up or visit is scheduled for [date] at [time]. Where applicable, you can expect the relevant team to connect with you within one hour.”\nAgent: “Have I understood that correctly?”\nCustomer (probable): “Yes, everything sounds spot on.”\nAgent: “Perfect. We’ll keep you updated and assist you smoothly through the next steps.”\nAgent: “Once again, [Customer Name], it’s been a pleasure speaking with you today. Thank you for considering IndiFrame. Have a wonderful day ahead.”\n20.1 Mandatory Closing Check\n\tParameter\n\tDetails / input\n\n\tCustomer name\n\t[Enter name]\n\n\tWindows required\n\t[Quantity + type]\n\n\tDoors required\n\t[Quantity + type]\n\n\tProject location\n\t[Location / city]\n\n\tAgreed next action\n\t[e.g. site consultation, callback, Experience Centre visit]\n\n\tRelevant team\n\t[Sales / partner / other]\n\n\tDate\n\t[Enter date]\n\n\tTime\n\t[Enter time]\n\n\tVisit type (if applicable)\n\t[Site consultation / Experience Centre]\n\n\tOne-hour callback expectation\n\t[Yes / No / timeframe]\n\n\nMandatory closing rule. Never end a connected call with a vague statement like “Okay, our team will contact you.” Always confirm the sequence before hanging up: Requirement, relevant team, action, date, time, expected follow-up.\n21. Master Qualification Checklist\n\tNo.\n\tQualification parameter\n\tDetails / input field\n\n\t1\n\tCustomer name\n\t[Enter name]\n\n\t2\n\tContact number\n\t[Enter phone number]\n\n\t3\n\tLead source\n\t[Website, referral, walk-in, etc.]\n\n\t4\n\tCity\n\t[Enter city]\n\n\t5\n\tLocality\n\t[Enter locality / area]\n\n\t6\n\tProject address / landmark\n\t[Enter address or landmark]\n\n\t7\n\tResidential / commercial\n\t[Residential / Commercial]\n\n\t8\n\tNew construction / renovation\n\t[New construction / Renovation]\n\n\t9\n\tConstruction stage\n\t[Foundation, plastering, ready, etc.]\n\n\t10\n\tWindows required\n\t[Yes / No / quantity]\n\n\t11\n\tDoors required\n\t[Yes / No / quantity]\n\n\t12\n\tApproximate quantity\n\t[Total units]\n\n\t13\n\tuPVC / aluminium / not decided\n\t[uPVC / Aluminium / Not decided]\n\n\t14\n\tProduct type / configuration\n\t[Sliding, casement, slide and fold, etc.]\n\n\t15\n\tPrimary requirement\n\t[Noise reduction, security, aesthetics, etc.]\n\n\t16\n\tBudget sensitivity\n\t[High / Medium / Low]\n\n\t17\n\tExpected installation timeline\n\t[Date or timeframe]\n\n\t18\n\tDecision maker\n\t[Self, spouse, joint, etc.]\n\n\t19\n\tArchitect / contractor / builder\n\t[Name and details if applicable]\n\n\t20\n\tCompetitor status\n\t[Considering which brand / none]\n\n\t21\n\tSite consultation requirement\n\t[Yes / No]\n\n\t22\n\tExperience Centre interest\n\t[Yes / No]\n\n\t23\n\tQuotation status\n\t[Pending / sent / revised]\n\n\t24\n\tCustomer objection\n\t[Price, timeline, material, etc.]\n\n\t25\n\tNext action\n\t[Enter next step]\n\n\t26\n\tNext follow-up date\n\t[Enter date and time]\n\n\t27\n\tFinal lead disposition\n\t[Stage code and reason]\n\n\n22. CRM and Operational Handover\n22.1 Handover rules\n\tLead\n\tWhat the agent does\n\n\tC2 (qualified)\n\tPost the customer’s contact details in the Daily Leads WhatsApp group and tag the Regional Sales Owner right after the call.\n\n\tC1 (future)\n\tSchedule a CRM follow-up task based on the projected construction / plastering readiness date.\n\n\tC7 (unserviceable or partner territory)\n\tRoute to the authorised Green Fortune partner and record C7 / ROUTE TO B2F in the CRM.\n\n\tUnanswered calls\n\tComplete a maximum of 15 attempts across 9 calendar days (Section 6.5) and log the exact disposition after each attempt.\n\n\tProtected accounts\n\tNever outbound qualify or dial (Section 3).\n\n\tExisting customer with a problem\n\tNever diagnose, never say whether it is covered. Capture what is happening, which window or room, when it started and the site address. Log it as a Service Request and route to the service team.\n\n\n22.4 Lead sources\n\tSource\n\tSub-sources\n\tSub-source mandatory\n\n\tPaid\n\tGoogle Ads; Google Performance Max; Meta Generic; Meta Remarketing; GMB; YouTube Ads\n\tNo\n\n\tOrganic Search\n\tn/a\n\tNo\n\n\tChat\n\tInstagram DM; WhatsApp DM; Facebook DM\n\tYes\n\n\tDirect\n\tWebsite; direct calls; showroom walk-in\n\tNo\n\n\tReferral\n\tCustomer; Contractor; Freelancer; Employee; Architect / Interior Designer\n\tYes\n\n\tChannel Partner\n\tFuture Living; Home 360 Degrees; Varaahi Enterprises (extensible as new dealers onboard)\n\tYes\n\n\tEvent\n\tAce Tech Mumbai 2026; I DAC Mumbai 2026 (extensible)\n\tYes\n\n\tSales Team\n\tn/a\n\tNo\n\n\tLead Spotting\n\tIndiFrame Projects; IndiFrame Retail\n\tYes\n\n\n22.5 Loss and closure reasons: use the matching one\n\tReason\n\tWhen to use\n\n\tBudget Constraints\n\tGenuine requirement, but available budget is not enough.\n\n\tChose Competitor\n\tCompared us with another company and decided to go with them.\n\n\tCompetition\n\tComparing multiple companies or quotations; not yet confirmed another company.\n\n\tCustomer Unresponsive After Quote\n\tQuotation shared, then the customer stopped responding.\n\n\tUnresponsive Prospect\n\tNot responding to repeated calls or messages, generally before a quotation.\n\n\tDuplicate Lead\n\tSame customer, number or requirement already in the CRM.\n\n\tInvalid / Out of Service\n\tNumber invalid, permanently switched off or out of service.\n\n\tJunk\n\tNot a genuine enquiry: wrong data, spam, irrelevant, test lead.\n\n\tLocal Fabricator\n\tCustomer specifically wants to buy from or continue with a local fabricator.\n\n\tLong Sales Cycle\n\tGenuine requirement but the decision will take long; no immediate action.\n\n\tMissing Features\n\tDoes not proceed because we lack a specific feature or specification.\n\n\tNo Decision-Maker\n\tPerson contacted cannot approve or confirm.\n\n\tNo Requirement\n\tCustomer currently has no requirement for windows or doors.\n\n\tPoor Fit\n\tOur product or service does not suit the requirement despite a genuine enquiry.\n\n\tPrice Too High\n\tCustomer specifically says our quoted price is too high.\n\n\tPricing\n\tPricing concern or question, but not specifically that it is too high.\n\n\tRequirement Cancelled\n\tGenuine requirement, but project or order cancelled completely.\n\n\tTimeline Mismatch\n\tRequired timeline does not match our available timeline.\n\n\tUnserviceable Location\n\tLocation is outside our service or installation area.\n\n\tWrong Number / Wrong Lead / Already Purchased / Project Postponed / Not Interested\n\tUse the matching reason where your CRM lists it; otherwise choose Other.\n\n\tOther\n\tNothing above matches.\n\n\n23. Quick Reference Card\n\tItem\n\tDetail\n\n\tPrice\n\tFrom ₹450 per sq ft onwards, plus 18% GST. Standard specification (white colour, clear glass, 60 series), installation and after-sales included; transport extra.\n\n\tLead time\n\tThree to four weeks minimum delivery time from order confirmation. Never a date, never faster.\n\n\tWarranty\n\t15 years profile; 5 years hardware (operational); colour: 7 years on solid grey and solid black, 15 years on solid white, 20 years on laminated.\n\n\tQuality\n\t30+ quality checks before dispatch.\n\n\tRetry cadence\n\tMaximum 15 attempts across 9 calendar days (Section 6.5).\n\n\tStages\n\tC0 new; C1 future (plastering incomplete); C2 active (plastering complete); C7 route to B2F.\n\n\tAlways\n\tFree site consultation; Experience Centre; a specific next step; log everything the same day.\n\n\tNever\n\tDo not commit to delivery or installation dates; total or per-window prices; discounts or premiums; specifications or measurements; design feasibility; or a diagnosis of a reported problem. Do not use “replace”, criticise competitors, imply that our material is cheaper through another route, invite or confirm a factory visit, or provide prices, specifications or timelines for aluminium.\n\n\tWhen stuck\n\t“That’s a good question, Sir. Let me have our team give you the exact answer.”\n\n\n24. Confirmed Decisions Where Source Files Differed\nThe source files disagreed on the points below. This table records the decision applied in this script.\n\tTopic\n\tDecision applied\n\n\tRetry cadence\n\t15 attempts across 9 calendar days, with the day-wise schedule in Section 6.5.\n\n\tFactory visits\n\tThe agent logs the request and tags the regional owner. Sales confirms. The agent never invites, confirms or refuses.\n\n\tColour warranty\n\t7 years on solid grey and solid black, 15 years on solid white, 20 years on laminated finishes.\n\n\tAluminium\n\tTreated as offered. The agent routes every aluminium enquiry to Sales and gives no price, specs or timelines.\n\n\tJubilee Hills\n\t“Opening soon. Sales will share the date.” Never a date.\n\n\tMachinery\n\tBoth are stated: European machinery and Turkish CNC machinery.\n\n\tDelivery time\n\tThree to four weeks is the minimum delivery time. The brochure’s 14-day claim is not used.\n\n\tStandard  starting rate\n\tThe starting rate includes standard white colour, clear glass and the 60 series.\n\n\tOpen directory items\n\tMumbai owner is still to be decided, Shyam Babu has no mobile in the directory and some city serviceability statuses are blank. Tag the regional owner; Sales confirms.\n\n\n\t\n\t\n\t\n\n\n","Secondary Scripts":"<PARSED TEXT FOR PAGE: 1 / 16>\n                            INDIFRAME WINDOWS & DOORS\n     Treat every call like a helpful consultation, not a rigid questionnaire.\n\n     Ask one question at a time and allow the customer to respond before continuing.\n\n     Listen actively, acknowledge concerns, and keep the tone supportive throughout the conversation.\n\n     Keep explanations simple and avoid unnecessary technical terminology.\n\n     Do not criticize competitors or local fabricators; redirect the discussion toward Indi Frame's value.\n\n     Do not promise unauthorized discounts, exact delivery dates, structural approvals, wind-load calculations,\n\n      mm-level specifications, chamber counts, or other technical details that require technical validation.\n\n     Every connected call must end with a clear, agreed next action.\n\n     Before ending, reconfirm the customer's requirement and the agreed action, team, date, and time wherever\n\n      applicable.\n\n     Installation is best planned after granite or marble sill work is completed, helping ensure proper fit and\n\n      reduce the risk of site damage.\n\n\n      2. Mandatory Discovery Questions\n\n      These six questions should be completed before assigning the lead stage, wherever the conversation allows.\n\n     Project Type: Is this project for your personal residential home or commercial property?\n\n     Site Location: Which specific city and area/locality is your construction site located in?\n\n     Stakeholder Role: Are you managing the build directly, or working with an architect or interior designer?\n\n     Construction Stage: What stage is the site currently in — Foundation, Brickwork, Plastering, or Finishing?\n\n     Quantity Estimate: Approximately how many window and door apertures/openings do you need to cover?\n\n     Aperture Readiness: Have internal and external plastering been completed around all window openings?\n\n\n      3. Lead Stage & Routing Rules\n\n     C0 – New Unqualified Lead: Initial lead ingestion. Initiate the first call immediately upon assignment.\n\n     C1 – Future Potential Lead: Foundation, slab, brickwork, or plastering is incomplete. Schedule follow-up\n\n      based on the projected readiness date.\n\n     C2 – Active / Qualified Lead: Plastering is complete and apertures are ready for audit. Post contact details in\n\n      the Daily Leads WhatsApp Group, tag the designated Regional Sales Owner, and offer a free site audit or\n\n      showroom/Experience Centre visit.\n\n     C7 – Routed to Partner (B2F): Site is outside direct IndiFrame service coverage. Offer the authorized Green\n\n      Fortune partner route and update CRM accordingly.\n\n     Pricing rule: quote only Starts from ₹450 per sq ft onwards plus applicable GST. Do not calculate custom\n\n      prices during initial qualifications.\n\n     Authorized warranty claims: 15-year profile warranty, 5-year hardware warranty, and 7-year color warranty.\n\n\nAcknowledged. Outbound qualification or dialing on protected accounts owned by Nikunj Mehta, Nayan Panchal,\nSushant Gosh, or\nRavi Boliipogu is strictly prohibited. These are high-value corporate/project accounts managed directly at the\nmanagement level\n\n\n\n\n                                The Six Mandatory Discovery Questions\n          Parameter                           Approved English Question                     Expected Output / Control\n\n\n                                Is this project for your personal residential home or     Residential / Commercial / Villa /\n         Project Type\n                                                 commercial property?                               Apartment\n\n                                    Which specific city and area/locality is your          Area name + PIN code; verify\n         Site Location\n                                           construction site located in?                          serviceability\n\n                                  Are you managing the build directly, or working        Self / Architect / Civil Contractor /\n       Stakeholder Role\n                                       with an architect or interior designer?                        Designer\n\n                                  What stage is the site currently in — Foundation,     Foundation / Brickwork / Plastering /\n      Construction Stage\n                                        Brickwork, Plastering, or Finishing?                          Interiors\n\n                                    Approximately how many window and door\n      Quantity Estimate                                                                   Estimated window & door count\n                                     apertures/o
