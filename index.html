const scriptContent = [["Treat every call as a helpful consultation, not a rigid questionnaire.","Ask one question at a time and allow the customer to respond. Listen actively, acknowledge concerns and keep the conversation supportive.","Use simple language. Do not criticize competitors or local fabricators. Explain IndiFrame's process and value without unsupported comparisons.","Do not promise unauthorized discounts, exact delivery dates, structural approvals, wind-load calculations, millimetre-level specifications, chamber counts or unvalidated technical details.","Every connected call must end with a clear agreed next action. Reconfirm the requirement, responsible team, action, date and time wherever applicable.","Installation is best planned after granite or marble sill work is completed, helping ensure proper fit and reduce site-damage risk."],["Complete these six parameters before assigning a lead stage, wherever the conversation allows.","Project Type: “Is this project for your personal residential home or commercial property?” Capture residential / commercial / villa / apartment.","Site Location: “Which specific city and area/locality is your construction site located in?” Capture area and PIN code; verify serviceability.","Stakeholder Role: “Are you managing the build directly, or working with an architect or interior designer?” Capture self / architect / civil contractor / designer.","Construction Stage: “What stage is the site currently in — Foundation, Brickwork, Plastering, or Finishing?” Capture actual stage; do not assume readiness.","Quantity Estimate: “Approximately how many window and door apertures/openings do you need to cover?” Capture separate quantities where possible.","Aperture Readiness: “Have internal and external plastering been completed around all window openings?” Capture Yes / No / In Progress.","Also capture new construction / renovation, windows / doors / both, uPVC / aluminium / undecided, preferred style, primary requirement, budget sensitivity, timeline, decision-maker, consultation interest, objection and agreed next action."],["C0 — New / Unqualified: New enquiry received. Check protected-account ownership, then initiate Call Attempt 1 immediately after assignment.","C1 — Future Potential: Foundation, slab, brickwork, structural or incomplete-plastering stage. Schedule CRM follow-up against projected readiness. For uPVC enquiries, source permits starting-rate communication ₹450 per sq. ft. onwards plus applicable GST. Route aluminium enquiries to Sales without price, specification or timeline commitments.","C2 — Active / Qualified: Plastering complete and apertures ready for audit. Offer free site consultation / measurement or Experience Centre visit. Post contact details in Daily Leads WhatsApp Group and tag the Regional Sales Owner. Route aluminium enquiries to Sales without price, specifications or timelines.","C7 — Partner Routed: Outside direct service coverage. Offer authorized Green Fortune partner route, transfer lead details and record C7 / ROUTE TO B2F. Do not promise full direct IndiFrame service.","Pricing: “Starts from ₹450 per sq. ft. onwards, plus applicable GST.” Do not calculate custom prices or single-window estimates during initial qualification.","Warranty reference in source script: 15-year profile, 5-year hardware and 7-year colour warranty. Confirm current written terms and exclusions before committing.","Protected accounts: do not outbound qualify or dial accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh or Ravi Boliipogu."],["Pricing: only the approved baseline starting rate of ₹450 per sq. ft. onwards plus applicable GST, where product / lead rules allow it. No custom calculations, single-window estimates or unauthorized discounts.","Technical scope: do not commit to exact delivery timelines, mm-level specifications, chamber counts, wind-load calculations, structural approvals or technical suitability during initial discovery. Refer validation to the technical site audit / TAO team.","Aluminium enquiries: route to Sales. Do not provide aluminium prices, specifications or timelines during initial qualification.","Unserviceable locations: offer authorized Green Fortune partner route and classify C7 / ROUTE TO B2F. Do not promise direct installation outside approved coverage.","Retry policy conflict: finalized qualification SOP states maximum 9 attempts over 12 calendar days; a separate script page mentions 15 attempts over 9 days. Operations must confirm the current policy before one cadence is published as active. Follow current live Operations instruction meanwhile.","Check protected-account ownership before outbound calling. Do not dial the four protected accounts listed in Lead Stage & Routing Rules.","If a customer asks to remove their number, acknowledge the request and update the system under the approved opt-out process."],["C0: new lead from marketing channels; make first call immediately after assignment, after protected-account check.","C1: future potential lead; schedule CRM follow-up against projected construction / plastering readiness.","C2: active / qualified lead; post contact details in Daily Leads WhatsApp Group and tag Regional Sales Owner. Confirm whether Sales contacted the customer; if not, update CRM and share the concern / details in the designated group.","C7: outside direct service coverage; offer authorized Green Fortune partner routing, transfer relevant details and record C7 / ROUTE TO B2F.","C4: Won Lead when payment is done and manufacturing has started. Update CRM, initiate order processing / manufacturing handover and share confirmation details with customer.","C6: Lost Lead due to a specific reason. Record reason, update status to Lost and schedule long-term nurturing / feedback follow-up if applicable.","Every handover should include requirement, location, project stage, quantity estimate and agreed next action wherever available. Update CRM immediately and accurately."],["Brand introduction: “Sir/Ma’am, IndiFrame provides different types of windows and doors based on customer requirements, design preferences and project needs. Our team can guide you on a suitable solution for your project.”","uPVC: “uPVC stands for Unplasticized Polyvinyl Chloride. It is a strong, durable and low-maintenance material commonly used for windows and doors. Depending on the overall configuration, it can provide good insulation and may help reduce outside noise and heat.”","Quick explanation: “IndiFrame provides uPVC and aluminium windows and doors in designs such as sliding, casement, fixed, tilt & turn and slide & fold. Our team can understand your requirements and suggest a suitable option.”","The source script identifies Hyderabad as headquarters and service across Andhra Pradesh, Maharashtra and Telangana. Verify the customer's specific locality before promising service.","Describe IndiFrame and Green Fortune accurately as the same company / business context. Do not call Green Fortune an unrelated third-party company. For outside direct coverage, use the authorized Green Fortune partner route."],["Mandatory renovation sequence: confirm whether the customer will remove / uninstall existing windows and doors before IndiFrame work starts.","Explain that existing windows and doors must be completely removed by the customer or their team before IndiFrame installation can begin. Ask whether the customer agrees.","If yes, capture expected date / time for removal and site readiness. Then confirm a convenient date and time for the team to follow up.","Approved line: “Since this is a renovation project, I’d like to confirm one important point. The existing windows and doors will need to be removed before our work starts. Will you be able to get them removed before we begin?”","If unsure: explain that IndiFrame does not provide uninstallation services and can start only after existing windows and doors have been completely removed by the customer's team. Ask for final confirmation and follow-up time.","Do not confirm installation before removal is complete. If no: customer can call back when the site is ready or contact 9959083498, as stated in the source script."],["Context: fresh enquiries from Meta, Google, website, WhatsApp or another digital channel.","Opening: “Good [morning/afternoon/evening], Sir/Ma’am. I’m calling from IndiFrame, a brand offering uPVC and aluminium windows and doors. We received your enquiry on [Facebook / Instagram / WhatsApp / Website]. Is this a good time for a quick conversation?”","Ask: windows / doors / both; new construction or renovation; residential or commercial; city and area / locality.","Quantity and style: “Approximately how many windows and doors do you need? A rough count is fine for now.” “Do you have a preferred style such as sliding, casement, fixed, tilt & turn or slide & fold?”","Site readiness: ask current stage, expected installation timeline, whether internal / external plastering is complete and whether granite / marble sill work is complete.","If customer wants installation before sill work: “I’ll note that. Our Sales Team will check the site condition and confirm the suitable installation stage with you.”","Decision-maker: ask whether the customer, architect, builder, contractor, designer or family member will make the final decision. Invite relevant stakeholders to the consultation.","Close by recapping quantity, type, project type and location. Offer Sales Team discussion, site consultation, Experience Centre visit or callback. Reconfirm next step."],["Source-content status: the latest detailed script reviewed includes a Field Spotted Lead scenario, but a separate approved Inbound / Walk-in script was not located. Do not present an invented walk-in script as approved.","Safe handling until a dedicated script is approved: acknowledge the enquiry, introduce IndiFrame, ask permission, identify windows / doors / both, capture project type and location, ask the six mandatory discovery questions, discuss only approved product information and agree the next action.","Related source scenario — Field Spotted Lead: “I’m calling on behalf of IndiFrame Windows and Doors. Our field officer [Name] recently noted your construction work at [Location]. Is this a good time to ask a few questions to understand your requirements?”","Confirm field notes: “Our notes mention approximately [Quantity] units and interest in [Type]. Is that still correct?” Verify location, construction stage, plastering / sill readiness and decision-maker status.","Offer Sales callback, site consultation, Experience Centre visit, factory visit or authorized partner follow-up depending on serviceability and customer preference."],["Context: customer visited an IndiFrame display, exhibition or public event.","Opening: “We noted that you visited our display at [Event Name] held on [Event Date] at [Event Location]. Is this a good time for a quick conversation?”","Confirm whether they need windows, doors or both; validate event notes on quantity and type; reconfirm project location.","Ask whether they are considering uPVC, aluminium or technical guidance; preferred style; and main priority such as appearance, ventilation, natural light, sound reduction, ease of operation, safety, heat reduction or privacy. Do not promise unverified performance.","Ask new construction / renovation, construction stage, plastering readiness, expected installation stage, sill work and decision-maker.","Close with site consultation, Sales callback, Experience Centre visit or Medchal factory visit. Reconfirm requirement, location, next step, date and time."],["Context: existing lead previously waiting for construction progress, budget, timing or a decision.","Opening: “We spoke [days/weeks] ago about your window and door requirements for [Project / Location]. I wanted to check how your project is moving along. Is this a good time?”","Recap: “Our notes mention [Quantity] units of [Type]. Have there been any changes?” Ask whether quotation / details were reviewed and what needs clarification.","Construction delay: “Construction timelines can change. Installation is best planned after granite or marble sill work is completed. What stage are your walls and sills at now?”","Budget: ask whether comparing a branded provider or local vendor. Explain consultation, measurement, manufacturing, installation coordination and after-sales support without criticizing competitors.","Close by recapping requirement, location, concerned team, concern / requirement and follow-up date / time. For immediate consultation, confirm Sales follow-up to coordinate the visit."],["Why choose IndiFrame? “We provide an organized process: professional consultation, suitable product guidance, standardized manufacturing, trained installation support, warranty support and after-sales service.”","Local fabricator objection: acknowledge the budget concern. Explain the structured process—product guidance, professional measurement support, manufacturing, installation coordination, warranty support and after-sales service. Do not criticize competitors.","Location concern: “We request the location to check service coverage for your area, assign the appropriate local team and arrange site measurement / installation support.”","Number source: “Your number was registered through the enquiry source where you expressed interest in windows and doors. We are following up to understand your requirements.”","Just exploring: “That is completely fine. Exploring options is a good way to start. We can understand what you are considering and guide you when you are ready.”","WhatsApp details: “I’d be happy to share relevant product details. May I confirm whether you are looking for windows, doors or both?”","Price only: “Our products start from ₹450 per sq. ft. onwards plus applicable GST, where applicable. May I ask for a rough quantity and type?” No custom quote or discount promise.","Customer shares measurements: collect width, height, quantity and type for initial review. Final precise measurements must be verified by the consultation team at site before final quotation.","Busy: ask for a convenient callback date / time. Remove number: acknowledge and update approved opt-out process. Already purchased: congratulate and close politely. Project postponed: note and agree a future check-in. Competitor selected: ask reason only if customer is comfortable.","Installation / after-sales: source confirms trained installation and dedicated after-sales teams; coordination depends on site condition and serviceability. Experience Centre visit can be offered."],["Immediately: “We can arrange the next step with the relevant team, subject to site readiness and technical confirmation.”","Within 1 month: plan consultation and next steps around the construction schedule.","1–3 months: use the available window to plan consultation, designs, measurements and next steps.","3–6 months: arrange follow-up closer to the installation timeline.","Price concern: acknowledge budget management and offer Sales discussion on value and suitable options.","Delivery / installation date: never promise an exact date during qualification. Timeline depends on project requirements and site readiness; the concerned team must assess and coordinate."],["D2 — Recap: “Following our previous conversation about your project in [Location], I wanted to recap your requirement for about [Quantity] units of [Type] and understand the next step.”","D3 — Site consultation pending: ask whether customer wants a convenient date / time for the technical team to visit and take required measurements.","D4 — Consultation completed: ask whether customer reviewed site details or wants the team to discuss next steps.","D5 — Quotation shared: ask whether customer reviewed the quotation and whether clarification is required.","D6 / D7 — Price high / competitor comparison: discuss product suitability, hardware, installation, warranty support and long-term service; offer Sales clarification.","D8 / D9 — Needs time / family decision: allow time and confirm a suitable follow-up date / time.","D10 — Project delayed: note temporary pause and agree a date to check back.","D11 — Selected another brand: ask which brand and whether decision was based on price, product, service, relationship or timeline, if customer is comfortable.","D12 / D13 — Ready to proceed / order confirmation pending: arrange order confirmation and next steps for custom-made manufacturing through the relevant team."],["Factory: Medchal, Hyderabad. Coordinate a factory visit so customers can understand the manufacturing process and product range. Confirm appointment date / time.","Hyderabad — Kukatpally Experience Centre: 4th Floor, 5-35, Vilax Prime, 189-A, 100 Feet Road, Prashanti Nagar, I.E., Kukatpally, Hyderabad, Telangana 500072.","Hyderabad — Jubilee Hills Experience Centre: 82, House No. 8, Road Number 40, CBI Colony, Jubilee Hills, Hyderabad, Telangana 500033.","Mumbai — Malad West Experience Centre: Lobby 3, 2nd Floor, Auris Galleria, 218, Kanchpada, Malad West, Mumbai, Maharashtra 400064.","Ask whether customer prefers Medchal factory, an Experience Centre, site consultation or Sales Team follow-up.","Reconfirm exact location, date and time. Do not imply walk-in availability; coordinate the appointment."],["Thank the customer and acknowledge the requirement.","Reconfirm quantity and type of windows / doors, project type and site location.","State agreed next step: Sales callback / site consultation / Experience Centre visit / factory visit / partner follow-up.","Confirm responsible team and scheduled date / time. State one-hour callback only where the relevant team has accepted that commitment.","Ask: “Have I understood that correctly?” Wait for confirmation.","Mandatory sequence: Requirement → Relevant Team → Action → Date → Time → Expected Follow-up. Never end with a vague “Okay, our team will contact you.”","Final close: “Thank you for considering IndiFrame. We appreciate your time and look forward to assisting you. Have a wonderful day.”"],["Capture customer name, contact number and lead source.","Capture city, locality, project address / landmark and verify serviceability.","Capture residential / commercial, new construction / renovation and construction stage.","Capture windows required, doors required, approximate quantity and uPVC / aluminium / undecided.","Capture product type / configuration and primary requirement.","Capture budget sensitivity, expected installation timeline and decision-maker details.","Capture architect / contractor / builder details, competitor status, site consultation interest, Experience Centre interest, quotation status and objection.","Capture agreed next action and next follow-up date / time.","Before closing, confirm customer name, window / door quantity and type, project location, action, relevant team, date, time and visit type if applicable."],["C2: post customer contact details in the Daily Leads WhatsApp Group and tag the Regional Sales Owner.","C1: schedule CRM follow-up based on projected construction / plastering readiness date.","C7: offer authorized Green Fortune partner routing, transfer relevant lead details and record C7 / ROUTE TO B2F.","Unanswered calls: record the exact disposition immediately after each attempt. Retry cadence is disputed across source files; follow current Operations instruction until confirmed.","Protected accounts: do not outbound qualify or dial accounts owned by Nikunj Mehta, Nayan Panchal, Sushant Gosh or Ravi Boliipogu.","Every handoff should include requirement, location, project stage, quantity estimate and agreed next step wherever available. Update CRM immediately and accurately."],["No verified Telugu transliteration / English-letter reference script was found in the approved source documents reviewed for this update.","Do not create or publish a translated call script as approved without the client / Process Team source version.","Until supplied, use the approved English script, ask the customer's language preference and arrange a language-capable team member where required."],["C4 / Won: source CRM matrix associates Won with payment done and manufacturing started. Update CRM, initiate order processing / manufacturing handover and share confirmation details with customer.","C6 / Lost: record the specific reason, update CRM status to Lost and schedule long-term nurturing / feedback follow-up if applicable.","Approved lost / closed reason examples: Not Interested; Wrong Number; Wrong Lead; Duplicate Lead; Already Purchased; Competitor Selected; Project Cancelled; Project Postponed; Budget Issue; Price Too High; Location Not Serviceable; No Requirement; Customer Unreachable.","Use the reason that accurately reflects the customer's statement. Do not mark Lost solely because one call was unanswered; follow current approved retry policy and CRM instruction.","C7 / ROUTE TO B2F is a partner-routed status for locations outside direct IndiFrame coverage. It is not the same as a Lost lead."]];
const scriptSummaries = ["Core principles, communication standards and non-negotiable controls.","Six mandatory discovery parameters and additional qualification fields.","C0, C1, C2 and C7 definitions, pricing and warranty references.","Pricing red lines, technical boundaries, serviceability, retries and opt-out.","CRM stage definitions, handover requirements and status transitions.","Approved brand introduction, uPVC explanation and company positioning.","Mandatory customer-led removal of existing windows and doors before renovation work.","Opening, qualification, readiness checks and closing for digital enquiries.","Walk-in script pending; includes approved interim discovery guidance and related field-spotted source note.","Expo / event lead opening, qualification and next-step close.","Warm-lead recap, construction delay, budget and follow-up close.","Approved objection responses for price, WhatsApp, callback, opt-out and competitors.","Approved response language for immediate, 1-month, 1–3-month and 3–6-month timelines.","D2–D13 follow-up prompts for consultation, quotation, delay and order readiness.","Medchal factory and Experience Centre addresses and visit coordination.","Mandatory Requirement → Team → Action → Date → Time → Follow-up close.","Master fields to capture before qualifying and closing a lead.","C1 / C2 / C7 handover rules, protected accounts and CRM update controls.","Telugu reference source not located; translation must not be invented.","Won / Lost / C7 status definitions and approved lost reasons."];
function scripts(){return H("FINAL CALL SCRIPTS","Scripts","Script search with customer intent filtering.","APPROVED")+ '<div class="card"><div class="search"><input id="scriptSearch" placeholder="Ask a customer question... e.g. What is the price?"><button class="btn" onclick="searchCX(&quot;scriptSearch&quot;)">Search</button></div><div class="tabs">'+["All Scripts","Discovery & Qualification","Pricing & Budget","Objection Handling","Brand & Products","Timeline & Urgency","Follow-Up","Lead Scenarios","Rules & Protocol","Closing & Handover"].map(x=>'<button class="tab" onclick="scriptTab(this)">'+x+'</button>').join("")+'</div><div class="list">'+scriptSections.map((s,i)=>'<div class="item"><small>SECTION '+(i+1)+' OF 20</small><h3>'+s+'</h3><p class="muted">'+scriptSummaries[i]+'</p><button class="btn" onclick="openScript('+i+')">Open</button> <button class="btn" onclick="fav(&quot;'+s+'&quot;)">☆ Save</button></div>').join("")+'</div></div>'}
function openScript(i){let a=scriptContent[i]||["No approved content is available for this section yet."];document.getElementById("view").innerHTML=H("SCRIPT LIBRARY",scriptSections[i],"Source-based reference · review status depends on the source document.")+'<div class="card"><button class="btn" onclick="go(&quot;scripts&quot;)">← Back to sections</button><div class="list" style="margin-top:14px">'+a.map(x=>'<div class="item scripttext">'+x+'</div>').join("")+'</div></div>'}
function products(){let cats=["Windows","Doors","Glass","Colours","Qualification"];let out=H("PRODUCT INFORMATION","Windows, doors, glass and colours","Refer only to approved product information.")+'<div class="tabs">'+cats.map(c=>'<button class="tab '+(productTab===c?'active':'')+'" onclick="productTab=&quot;'+c+'&quot;;render()">'+c+'</button>').join("")+'</div>';if(productTab==="Windows"||productTab==="Doors"){let ps=productData.filter(p=>productTab==="Windows"?p[0]!=="Lift & Slide Door":p[0]==="Lift & Slide Door");out+='<div class="grid">'+ps.map(p=>'<div class="item"><small>'+productTab+'</small><h3>'+p[0]+'</h3><p>'+p[1]+'</p><p><b>Typical Use:</b> '+p[2]+'</p><p><b>Key Features:</b> '+p[3]+'</p><p><b>Customer Benefit:</b> '+p[4]+'</p></div>').join("")+'</div>'}else if(productTab==="Glass")out+='<div class="grid">'+["Clear","Laminated","Toughened","DGU","Reflective","Frosted"].map(x=>'<div class="item"><h3>'+x+' Glass</h3><p>Confirm suitability and technical specifications with the sales/technical team. Do not make unsupported performance claims.</p></div>').join("")+'</div>';else if(productTab==="Colours")out+='<div class="item"><h3>Approved colour / laminate range</h3><p>Solid White · Solid Black · Dark Grey · Dark Oak · Golden Oak · Jet Black Laminated · Red Oak · Walnut</p><small>Confirm current availability and warranty applicability from the latest product guide.</small></div>';else out+='<div class="item"><h3>Product qualification</h3><p>Capture opening type, approximate quantity, project location, usage, design preference and construction readiness. Final selection and measurements require technical validation.</p></div>';return out}
function sop(){let s=["Lead Received","Lead Verification","Customer Contact","Requirement Qualification","Product Discussion","Customer Requirement Capture","Sales Handover / Next Action","CRM Update","Follow-up","Lead Closure / Final Status"];return H("PROCESS SOP","Lead receipt to follow-up","Follow the correct process at every stage.","UNDER REVIEW")+'<div class="list">'+s.map((x,i)=>'<div class="item"><h3>'+(i+1)+'. '+x+'</h3><p>'+["Review new lead assignment and source.","Check protected-account status and verify customer details.","Use the correct opening for the lead source and obtain permission.","Capture project, location, role, construction stage, quantity and aperture readiness.","Discuss relevant product options using approved information only.","Record requirement, timeline, priorities and customer concerns accurately.","Agree the responsible team and next action with the customer.","Update CRM with exact conversation outcome and next step.","Schedule and complete follow-up as agreed; update CRM activity.","Confirm the final lead status, record the approved reason and communicate the agreed next step."][i]+'</p></div>').join("")+'</div><div class="notice"><b>Operating controls</b><p>Check protected accounts before outbound calling. Do not promise unapproved discounts, technical specifications or exact delivery dates. Outside direct coverage, use the authorized Green Fortune routing process.</p></div>'}
function faqs(){let f=[["Who is IndiFrame?","IndiFrame is a windows and doors brand offering uPVC windows and doors with in-house manufacturing, installation coordination and written warranty support."],["Where are you based?","IndiFrame is a pan-India brand headquartered in Hyderabad, where its manufacturing facility is also located. Maharashtra customers are supported through the Malad West office and Mumbai–Pune–Nagpur service team."],["Weren't you Green Fortune?","Green Fortune is the profile brand and IndiFrame is the finished windows and doors brand. Both are part of the same company, with the same ownership, factory and team."],["Where is your factory?","The manufacturing facility is located at Medchal, Hyderabad."],["Do you have a showroom?","Use the approved term Experience Centre. Primary locations include Kukatpally, Hyderabad and Malad West, Mumbai. Confirm current appointment details."],["Is uPVC strong?","uPVC means unplasticized polyvinyl chloride. It is a rigid engineered material used for windows and doors. Avoid unsupported absolute durability claims."],["What is DGU?","DGU means Double Glazed Unit. It has two glass panes separated by a sealed gap. Performance depends on the full glass and window configuration."],["What is your rate?","Pricing starts from ₹450 per sq. ft. onwards plus applicable GST. Exact pricing depends on style, dimensions, quantity and final specifications."],["What is included?","The approved FAQ describes custom windows, trained in-house installation and after-sales service. GST and transport are billed separately; confirm current quotation terms."],["What is the warranty?","Reference script states 15-year profile, 5-year hardware and 7-year colour warranty. Confirm current product-specific terms and exclusions before committing."]];return H("FAQS & OBJECTION HANDLING","Approved customer answers","Find approved answers to common customer questions and objections.")+'<div class="search"><input id="faqSearch" placeholder="Search FAQs..."><button class="btn" onclick="filterList(&quot;faqSearch&quot;,&quot;faqList&quot;)">Search</button></div><div class="list" id="faqList">'+f.map(x=>'<details class="item"><summary><b>'+x[0]+'</b></summary><p>'+x[1]+'</p></details>').join("")+'</div><small>For questions not covered here, consult the latest FAQ Bank and approved script. Do not invent price, warranty, availability or technical details.</small>'}
function sales(){return H("SALES TEAM DIRECTORY","19 team members","Contacts and regional sales coverage from the supplied IndiFrame directory.")+'<div class="search"><input id="teamSearch" placeholder="Search name, designation, mobile or city..." oninput="filterTeam()"><select id="city"><option value="">All Cities</option>'+Array.from(new Set(teamData.map(x=>x[5]))).map(c=>'<option>'+c+'</option>').join("")+'</select></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Designation</th><th>Mobile</th><th>Email</th><th>Manager</th><th>City</th></tr></thead><tbody id="teamRows">'+teamData.map(teamRow).join("")+'</tbody></table></div>'}
function teamRow(t){return '<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td><td>'+t[2]+' <button onclick="copy(&quot;'+t[2]+'&quot;)">Copy</button></td><td>'+t[3]+'</td><td>'+t[4]+'</td><td>'+t[5]+'</td></tr>'}
function filterTeam(){let q=document.getElementById("teamSearch").value.toLowerCase(),c=document.getElementById("city").value;document.getElementById("teamRows").innerHTML=teamData.filter(t=>(!c||t[5]===c)&&t.join(" ").toLowerCase().includes(q)).map(teamRow).join("")}
function updates(){let u=[["2026-10-05","Process Update","Updated call qualification flow","Qualification questions updated; agents must use the latest approved questions.","2026-10-07","1.1","TL"],["2026-10-03","Script Update","Opening script revised","Use the latest version from the Scripts section.","2026-10-05","1.1","Process Team"],["2026-10-01","Product Update","Product information structure added","Approved specifications to be updated by Process/Client Team.","2026-10-01","1.0","Process Team"],["2026-09-25","Notice","Use only approved scripts","Old PDFs are no longer valid.","2026-09-25","1.0","Manager"]];return H("LATEST UPDATES","Recent process changes and announcements","Check effective dates and use the latest approved version.","UNDER REVIEW")+'<div class="list">'+u.map(x=>'<div class="item"><small>'+x[0]+' · '+x[1]+'</small><h3>'+x[2]+'</h3><p>'+x[3]+'</p><small>Effective: '+x[4]+' · Version: '+x[5]+' · Updated by: '+x[6]+' · ACTIVE</small></div>').join("")+'</div>'}
function favorites(){let a=JSON.parse(localStorage.getItem("ifFav")||"[]");return H("MY QUICK ACCESS","Your pinned content","Your saved shortcuts are stored locally on this device.")+(a.length?'<div class="list">'+a.map(x=>'<div class="item">'+x+' <button class="btn" onclick="unfav(&quot;'+x+'&quot;)">Remove</button></div>').join("")+'</div>':'<div class="item">No favorites saved yet — suggested shortcuts: Opening Script · Objection Handling · Product Information · Lead Stages.</div>')}
function cxPage(){return H("CUSTOMER POV QUESTIONS","Customer questions","100 customer questions mapped to the approved script structure.")+'<div class="search"><input id="cxSearch" placeholder="Search price, warranty, renovation, installation..." oninput="filterList(&quot;cxSearch&quot;,&quot;cxList&quot;)"></div><div class="list" id="cxList">'+cx.map((q,i)=>'<details class="item"><summary><b>Q'+(i+1)+'. '+q+'</b></summary><p>Refer to the matching approved call-script section or FAQ Bank. Use the latest approved answer; route technical or commercial confirmation to the concerned team.</p></details>').join("")+'</div><small>Questions captured: '+cx.length+'. Detailed answer mapping will be consolidated from the source documents.</small>'}
function render(){let f={home,scripts,products,sop,faqs,sales,updates,favorites,cx:cxPage};document.getElementById("view").innerHTML=f[page]()+'<div class="footer">IndiFrame Agent Portal · Internal Use Only · HRHNEXT · v1.0</div>';document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function go(p){page=p;render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function filterList(inputId,listId){let q=document.getElementById(inputId).value.toLowerCase();document.getElementById(listId).querySelectorAll(".item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none")}
function searchCX(id){let el=document.getElementById(id||"homeSearch");let q=el.value.trim();if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}}
function scriptTab(btn){document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let t=btn.innerText.toLowerCase();document.querySelectorAll(".list .item").forEach(x=>{let s=x.innerText.toLowerCase();let ok=t==="all scripts"||(t.includes("discovery")&&/discovery|qualification/.test(s))||(t.includes("pricing")&&/pricing|budget/.test(s))||(t.includes("objection")&&/objection/.test(s))||(t.includes("brand")&&/brand|product/.test(s))||(t.includes("timeline")&&/timeline|priority/.test(s))||(t.includes("follow")&&/follow/.test(s))||(t.includes("scenario")&&/scenario/.test(s))||(t.includes("rules")&&/rules|protocol/.test(s))||(t.includes("closing")&&/closing|handover/.test(s));x.style.display=ok?"":"none"})}
function fav(x){let a=JSON.parse(localStorage.getItem("ifFav")||"[]");if(!a.includes(x))a.push(x);localStorage.setItem("ifFav",JSON.stringify(a));alert("Added to My Quick Access")}
function unfav(x){localStorage.setItem("ifFav",JSON.stringify(JSON.parse(localStorage.getItem("ifFav")||"[]").filter(y=>y!==x)));render()}
function copy(x){navigator.clipboard&&navigator.clipboard.writeText(x);alert("Copied")}
document.getElementById("searchBtn").onclick=()=>{let q=prompt("Search the Agent Help Desk");if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("searchBtn").click()}});
render();
