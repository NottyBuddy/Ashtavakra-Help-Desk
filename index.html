function openScript(i){let a=[];if(i===0)a=["Treat every call like a helpful consultation, not a rigid questionnaire.","Ask one question at a time and allow the customer to respond before continuing.","Listen actively, acknowledge concerns and keep a supportive tone.","Keep explanations simple; avoid unnecessary technical terminology.","Do not criticize competitors or local fabricators; redirect to IndiFrame's value.","Do not promise unauthorized discounts, exact delivery dates, structural approvals, wind-load calculations, mm-level specifications, chamber counts or unvalidated technical details.","Every connected call must end with a clear, agreed next action.","Reconfirm the requirement, action, responsible team, date and time wherever applicable.","Installation is best planned after granite or marble sill work is completed."];else if(i===1)a=["Project Type: Is this project for your personal residential home or commercial property?","Site Location: Which specific city and area/locality is your construction site located in?","Stakeholder Role: Are you managing the build directly, or working with an architect or interior designer?","Construction Stage: What stage is the site currently in — Foundation, Brickwork, Plastering, or Finishing?","Quantity Estimate: Approximately how many window and door openings do you need?","Aperture Readiness: Have internal and external plastering been completed around all window openings?"];else if(i===2)a=["C0 – New / Unqualified: Enquiry received; qualification details are not established. Initiate the first call immediately.","C1 – Future Potential: Project is not ready for immediate execution, such as foundation, brickwork, slab stage or incomplete plastering. Schedule follow-up.","C2 – Active / Qualified: Plastering and aperture readiness are sufficiently complete. Share with the Regional Sales Owner and offer a free site consultation or Experience Centre visit.","C7 – Partner Routed: Location is outside direct service coverage. Offer the authorized Green Fortune route and update CRM.","Pricing starts from ₹450 per sq. ft. onwards plus applicable GST. Do not calculate a custom quote during initial qualification.","Reference warranty: 15-year profile, 5-year hardware and 7-year colour warranty. Confirm current terms before committing."];else a=["Use the latest approved source script for this section.","Route technical, commercial or serviceability confirmation to the concerned team.","Do not make unapproved commitments to customers."];document.getElementById("view").innerHTML=H("SCRIPT LIBRARY",scriptSections[i],"Source-based script reference.")+'<div class="card"><button class="btn" onclick="go('scripts')">← Back to sections</button><div class="list" style="margin-top:14px">'+a.map(x=>'<div class="item">'+x+'</div>').join("")+'</div></div>'}

function teamRow(t){return '<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td><td>'+t[2]+' <button onclick="copy(''+t[2]+'')">Copy</button></td><td>'+t[3]+'</td><td>'+t[4]+'</td><td>'+t[5]+'</td></tr>'}
function filterTeam(){let q=document.getElementById("teamSearch").value.toLowerCase(),c=document.getElementById("city").value;document.getElementById("teamRows").innerHTML=teamData.filter(t=>(!c||t[5]===c)&&t.join(" ").toLowerCase().includes(q)).map(teamRow).join("")}
function updates(){let u=[["2026-10-05","Process Update","Updated call qualification flow","Qualification questions updated; agents must use the latest approved questions.","2026-10-07","1.1","TL"],["2026-10-03","Script Update","Opening script revised","Use the latest version from the Scripts section.","2026-10-05","1.1","Process Team"],["2026-10-01","Product Update","Product information structure added","Approved specifications to be updated by Process/Client Team.","2026-10-01","1.0","Process Team"],["2026-09-28","Escalation Update","Escalation matrix contacts pending","Contact details pending Operations Team validation.","2026-09-28","1.0","Operations Team"],["2026-09-25","Notice","Use only approved scripts","Old PDFs are no longer valid.","2026-09-25","1.0","Manager"]];return H("LATEST UPDATES","Recent process changes and announcements","Check effective dates and use the latest approved version.","UNDER REVIEW")+'<div class="list">'+u.map(x=>'<div class="item"><small>'+x[0]+' · '+x[1]+'</small><h3>'+x[2]+'</h3><p>'+x[3]+'</p><small>Effective: '+x[4]+' · Version: '+x[5]+' · Updated by: '+x[6]+' · ACTIVE</small></div>').join("")+'</div>'}
function favorites(){let a=JSON.parse(localStorage.getItem("ifFav")||"[]");return H("MY QUICK ACCESS","Your pinned content","Your saved shortcuts are stored locally on this device.")+(a.length?'<div class="list">'+a.map(x=>'<div class="item">'+x+' <button class="btn" onclick="unfav(''+x+'')">Remove</button></div>').join("")+'</div>':'<div class="item">No favorites saved yet — suggested shortcuts: Opening Script · Objection Handling · Product Information · Lead Stages.</div>')}
function cxPage(){return H("CUSTOMER POV QUESTIONS","Customer questions","100 customer questions mapped to the approved script structure.")+'<div class="search"><input id="cxSearch" placeholder="Search price, warranty, renovation, installation..." oninput="filterList('cxSearch','cxList')"></div><div class="list" id="cxList">'+cx.map((q,i)=>'<details class="item"><summary><b>Q'+(i+1)+'. '+q+'</b></summary><p>Refer to the matching approved call-script section or FAQ Bank. Use the latest approved answer; route technical or commercial confirmation to the concerned team.</p></details>').join("")+'</div><small>Questions captured: '+cx.length+'. Detailed answer mapping will be consolidated from the source documents.</small>'}
function render(){let f={home,scripts,products,sop,faqs,sales,updates,favorites,cx:cxPage};document.getElementById("view").innerHTML=f[page]()+'<div class="footer">IndiFrame Agent Portal · Internal Use Only · HRHNEXT · v1.0</div>';document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function go(p){page=p;render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function filterList(inputId,listId){let q=document.getElementById(inputId).value.toLowerCase();document.getElementById(listId).querySelectorAll(".item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none")}
function searchCX(id){let el=document.getElementById(id||"homeSearch");let q=el.value.trim();if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}}
function scriptTab(btn){document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let t=btn.innerText.toLowerCase();document.querySelectorAll(".list .item").forEach(x=>{let s=x.innerText.toLowerCase();let ok=t==="all scripts"||(t.includes("discovery")&&/discovery|qualification/.test(s))||(t.includes("pricing")&&/pricing|budget/.test(s))||(t.includes("objection")&&/objection/.test(s))||(t.includes("brand")&&/brand|product/.test(s))||(t.includes("timeline")&&/timeline|priority/.test(s))||(t.includes("follow")&&/follow/.test(s))||(t.includes("scenario")&&/scenario/.test(s))||(t.includes("rules")&&/rules|protocol/.test(s))||(t.includes("closing")&&/closing|handover/.test(s));x.style.display=ok?"":"none"})}
function fav(x){let a=JSON.parse(localStorage.getItem("ifFav")||"[]");if(!a.includes(x))a.push(x);localStorage.setItem("ifFav",JSON.stringify(a));alert("Added to My Quick Access")}
function unfav(x){localStorage.setItem("ifFav",JSON.stringify(JSON.parse(localStorage.getItem("ifFav")||"[]").filter(y=>y!==x)));render()}
function copy(x){navigator.clipboard&&navigator.clipboard.writeText(x);alert("Copied")}
document.getElementById("searchBtn").onclick=()=>{let q=prompt("Search the Agent Help Desk");if(q){go("cx");document.getElementById("cxSearch").value=q;filterList("cxSearch","cxList")}};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("searchBtn").click()}});
render();
</script></body></html>
